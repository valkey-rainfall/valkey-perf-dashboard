<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductress — Host Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h1 { color: #58a6ff; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .hosts { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; }
        .host-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.25rem; }
        .host-card h2 { font-size: 1.1rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-dot.running { background: #3fb950; }
        .status-dot.stopped { background: #f85149; }
        .status-dot.unreachable { background: #6e7681; }
        .status-dot.stale { background: #d29922; }
        .host-card.alarm-warn { border-color: #d29922; }
        .host-card.alarm-crit { border-color: #f85149; }
        .card-banner { padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.8rem; margin-bottom: 0.75rem; font-weight: 600; }
        .card-banner.warn { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid #d29922; }
        .card-banner.crit { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; }
        .server-banner { padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1.5rem; font-weight: 600; display: none; }
        .server-banner.warn { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid #d29922; display: block; }
        .server-banner.crit { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; display: block; }
        .meta { color: #8b949e; font-size: 0.8rem; margin-bottom: 1rem; }
        .section { margin-bottom: 1rem; }
        .section-title { font-size: 0.75rem; text-transform: uppercase; color: #8b949e; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
        .current-task { background: #1c2128; padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; }
        .progress-bar { height: 4px; background: #30363d; border-radius: 2px; margin-top: 0.5rem; overflow: hidden; }
        .progress-fill { height: 100%; background: #58a6ff; border-radius: 2px; transition: width 0.3s; }
        .queue-list { list-style: none; font-size: 0.8rem; }
        .queue-list li { padding: 0.25rem 0; border-bottom: 1px solid #21262d; color: #8b949e; }
        .results-table { width: 100%; font-size: 0.75rem; border-collapse: collapse; }
        .results-table td { padding: 0.2rem 0.4rem; border-bottom: 1px solid #21262d; }
        .results-table .score { color: #3fb950; font-weight: 600; text-align: right; }
        .eta { color: #58a6ff; font-weight: 600; font-size: 0.9rem; }
        .stale-warning { color: #d29922; font-size: 0.75rem; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 1.5rem; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="nav"><a href="index.html">← Performance Dashboard</a> <label style="float:right;font-size:0.8rem;cursor:pointer"><input type="checkbox" id="autoRefresh" checked> Auto-refresh (60s)</label></div>
    <h1>🎵 Conductress — Host Status</h1>
    <div class="server-banner" id="serverBanner"></div>
    <div class="hosts" id="hosts"></div>
    <script>
const HOSTS = [
    {id: 'arm', label: 'armbench', subtitle: 'Graviton 3 · 64 cores'},
    {id: 'graviton4', label: 'g4bench', subtitle: 'Graviton 4 · 192 cores'},
    {id: 'x86', label: 'bench', subtitle: 'AMD EPYC 9R14 · 192 cores'},
    {id: 'intel', label: 'intelbench', subtitle: 'Xeon 8488C · 48 cores'},
];
const STATUS_BASE = 'https://data.conductress.rainsupreme.net/status';

function formatScore(score, method) {
    if (!score) return '—';
    if (method === 'latency') return score.toFixed(0) + 'µs';
    if (score > 1e6) return (score / 1e6).toFixed(2) + 'M';
    if (score > 1e3) return (score / 1e3).toFixed(1) + 'K';
    return score.toFixed(1);
}

function timeAgo(str) {
    if (!str) return '';
    // Handle Conductress format: "2026.05.24_02.28.19.311128"
    let d = new Date(str);
    if (isNaN(d)) {
        const m = str.match(/^(\d{4})\.(\d{2})\.(\d{2})_(\d{2})\.(\d{2})\.(\d{2})/);
        if (m) d = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`);
    }
    const diff = (Date.now() - d.getTime()) / 1000;
    if (isNaN(diff)) return '';
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
}

function renderHost(data, label, subtitle) {
    const reportedState = data.runner?.state || 'unreachable';
    const ageSec = data.timestamp ? (Date.now() - new Date(data.timestamp).getTime()) / 1000 : Infinity;
    // Tiered staleness: >5min = warn (missed ~5 pushes), >30min = critical.
    const staleWarn = ageSec > 300 && ageSec <= 1800;
    const staleCrit = ageSec > 1800;
    const stale = staleWarn || staleCrit;
    // When stale, the reported runner state is untrustworthy — override the dot.
    const dotClass = staleCrit ? 'stopped' : staleWarn ? 'stale' : reportedState;
    const cardClass = staleCrit ? 'host-card alarm-crit' : staleWarn ? 'host-card alarm-warn' : 'host-card';
    let staleBanner = '';
    if (stale) {
        const cls = staleCrit ? 'crit' : 'warn';
        staleBanner = `<div class="card-banner ${cls}">⚠ No update for ${timeAgo(data.timestamp).replace(' ago','')} — publishing may be broken (runner state unknown)</div>`;
    }

    let taskHtml = '<div class="current-task">Idle</div>';
    if (data.current_task) {
        const t = data.current_task;
        taskHtml = `<div class="current-task">
            <strong>${t.type}</strong> — ${t.state} (${t.steps})<br>
            <span style="color:#8b949e">${t.elapsed_sec}s elapsed</span>
            <div class="progress-bar"><div class="progress-fill" style="width:${t.progress_pct}%"></div></div>
        </div>`;
    }

    let queueHtml = '<span style="color:#8b949e">Empty</span>';
    if (data.queue?.depth > 0) {
        const items = data.queue.tasks.slice(0, 5).map(t =>
            `<li>${t.type} — ${t.note || t.specifier}</li>`
        ).join('');
        queueHtml = `<ul class="queue-list">${items}</ul>`;
        if (data.queue.depth > 5) queueHtml += `<span style="color:#8b949e;font-size:0.75rem">+${data.queue.depth - 5} more</span>`;
    }

    let resultsHtml = '';
    if (data.recent_results?.length) {
        const rows = data.recent_results.slice(0, 5).map(r =>
            `<tr><td>${r.commit || '—'}</td><td>${r.method || ''}</td><td class="score">${formatScore(r.score, r.method)}</td><td style="color:#8b949e">${timeAgo(r.completed)}</td></tr>`
        ).join('');
        resultsHtml = `<table class="results-table">${rows}</table>`;
    }

    return `<div class="${cardClass}">
        <h2><span class="status-dot ${dotClass}"></span>${label}</h2>
        ${staleBanner}
        <div class="meta">
            <span style="color:#8b949e">${subtitle}</span><br>
            Updated ${timeAgo(data.timestamp)}
            ${data.eta_minutes > 0 ? `· <span class="eta">ETA ${data.eta_minutes}m</span>` : ''}
        </div>
        <div class="section"><div class="section-title">Current Task</div>${taskHtml}</div>
        <div class="section"><div class="section-title">Queue (${data.queue?.depth || 0})</div>${queueHtml}</div>
        ${resultsHtml ? `<div class="section"><div class="section-title">Recent Results</div>${resultsHtml}</div>` : ''}
    </div>`;
}

function fmtBytes(b) {
    if (b >= 1e9) return (b / 1e9).toFixed(1) + ' GB';
    if (b >= 1e6) return (b / 1e6).toFixed(0) + ' MB';
    return b + ' B';
}

async function renderServerBanner() {
    const el = document.getElementById('serverBanner');
    el.className = 'server-banner';  // reset (hidden by default)
    let d;
    try {
        const resp = await fetch(`${STATUS_BASE}/_server.json?t=${Date.now()}`);
        if (!resp.ok) return;  // no disk writer deployed yet — degrade silently
        d = await resp.json();
    } catch { return; }
    const freePct = d.free_pct != null ? d.free_pct
        : (d.size_bytes ? Math.round(d.avail_bytes * 100 / d.size_bytes) : null);
    if (freePct == null) return;
    // If the disk reading itself is stale (>10min), the number can't be trusted.
    const readingStale = d.timestamp && (Date.now() - new Date(d.timestamp).getTime()) > 600000;
    if (freePct < 5) {
        el.className = 'server-banner crit';
        el.textContent = `🔴 Data server disk critically low: ${freePct}% free (${fmtBytes(d.avail_bytes)} of ${fmtBytes(d.size_bytes)}). Publishing will break when it fills — free space now.`;
    } else if (freePct < 15) {
        el.className = 'server-banner warn';
        el.textContent = `⚠ Data server disk low: ${freePct}% free (${fmtBytes(d.avail_bytes)} of ${fmtBytes(d.size_bytes)}).`;
    } else if (readingStale) {
        el.className = 'server-banner warn';
        el.textContent = `⚠ Data server disk reading is stale (last ${timeAgo(d.timestamp)}) — disk writer may be down.`;
    }
}

async function loadStatus() {
    renderServerBanner();
    const container = document.getElementById('hosts');
    const cards = [];
    for (const host of HOSTS) {
        try {
            const resp = await fetch(`${STATUS_BASE}/${host.id}.json?t=${Date.now()}`);
            if (resp.ok) {
                cards.push(renderHost(await resp.json(), host.label, host.subtitle));
            } else {
                cards.push(renderHost({runner: {state: 'unreachable'}, timestamp: new Date().toISOString()}, host.label, host.subtitle));
            }
        } catch {
            cards.push(renderHost({runner: {state: 'unreachable'}, timestamp: new Date().toISOString()}, host.label, host.subtitle));
        }
    }
    container.innerHTML = cards.join('');
}

loadStatus();
let refreshTimer = setInterval(loadStatus, 60000);
document.getElementById('autoRefresh').addEventListener('change', (e) => {
    if (e.target.checked) { refreshTimer = setInterval(loadStatus, 60000); loadStatus(); }
    else { clearInterval(refreshTimer); }
});
    </script>
</body>
</html>
