<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductress — Host Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h1 { color: #58a6ff; margin: 0; font-size: 1.15rem; white-space: nowrap; }
        .status-header { display: flex; align-items: center; gap: 0.65rem; margin-bottom: 0.9rem; min-width: 0; }
        .status-header > a { color: #8b949e; font-size: 0.78rem; white-space: nowrap; }
        .fleet-metrics { display: flex; align-items: center; gap: 0.35rem; flex: 1 1 auto; min-width: 0; }
        .metric-chip { color: #8b949e; background: #161b22; border: 1px solid #30363d; border-radius: 999px; padding: 0.18rem 0.5rem; font-size: 0.69rem; white-space: nowrap; }
        .metric-chip.ok { color: #3fb950; border-color: rgba(63,185,80,0.45); }
        .refresh-toggle { color: #8b949e; font-size: 0.72rem; cursor: pointer; white-space: nowrap; margin-left: auto; }
        .hosts { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 1rem; max-width: 1600px; margin: 0 auto; align-items: start; }
        .host-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; min-width: 0; }
        .host-card h2 { font-size: 1.05rem; display: flex; align-items: flex-start; gap: 0.55rem; }
        .host-title { color: #f0f6fc; font-weight: 600; }
        .host-subtitle { display: block; color: #6e7681; font-size: 0.72rem; font-weight: 400; margin-top: 0.1rem; }
        .status-dot { width: 10px; height: 10px; margin-top: 0.35rem; flex: 0 0 auto; border-radius: 50%; display: inline-block; }
        .status-dot.running { background: #3fb950; }
        .status-dot.stopped { background: #f85149; }
        .status-dot.unreachable { background: #6e7681; }
        .status-dot.stale { background: #d29922; }
        .host-card.alarm-warn { border-color: #d29922; }
        .host-card.alarm-crit { border-color: #f85149; }
        .card-banner { padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.8rem; margin-top: 0.65rem; font-weight: 600; }
        .card-banner.warn { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid #d29922; }
        .card-banner.crit { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; }
        .server-banner { padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; font-weight: 600; display: none; }
        .server-banner.warn { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid #d29922; display: block; }
        .server-banner.crit { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; display: block; }
        .meta { color: #8b949e; font-size: 0.76rem; margin: 0.35rem 0 0 1.05rem; }
        .task-flow { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
        .section { min-width: 0; border-radius: 6px; padding: 0.55rem 0.65rem; border-left: 3px solid #30363d; background: #12171d; }
        .section.remote { border-left-color: #58a6ff; background: rgba(88,166,255,0.055); }
        .section.local { border-left-color: #a371f7; background: rgba(163,113,247,0.055); }
        .section.results { border-left-color: #3fb950; background: rgba(63,185,80,0.045); }
        .section-title { display: flex; justify-content: space-between; gap: 0.5rem; font-size: 0.68rem; text-transform: uppercase; color: #8b949e; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
        .section.remote .section-title { color: #79c0ff; }
        .section.local .section-title { color: #d2a8ff; }
        .section.results .section-title { color: #56d364; }
        .section-count { color: #6e7681; text-align: right; text-transform: none; letter-spacing: normal; }
        .item-list { list-style: none; font-size: 0.78rem; }
        .item-list li { padding: 0.42rem 0; border-top: 1px solid #21262d; min-width: 0; }
        .item-list li.current-task { padding: 0.55rem 0; }
        .item-description { color: #c9d1d9; overflow-wrap: anywhere; line-height: 1.25; }
        .item-meta { color: #6e7681; font-size: 0.69rem; margin-top: 0.12rem; overflow-wrap: anywhere; }
        .empty-list { color: #6e7681; font-size: 0.76rem; padding: 0.38rem 0; border-top: 1px solid #21262d; }
        .task-overflow { border-top: 1px solid #30363d; margin-top: 0.15rem; }
        .task-overflow summary { cursor: pointer; color: #8b949e; font-size: 0.72rem; padding: 0.42rem 0; user-select: none; }
        .task-overflow summary:hover, .task-overflow summary:focus-visible { color: #c9d1d9; }
        .task-overflow[open] summary { color: #c9d1d9; }
        .task-snapshot-note { padding-top: 0.35rem; font-style: italic; }
        .score { color: #3fb950; font-weight: 600; }
        .timeline { margin-top: 0.42rem; }
        .timeline-label { display: flex; justify-content: space-between; gap: 0.5rem; color: #8b949e; font-size: 0.68rem; }
        .timeline-state { color: #58a6ff; font-weight: 600; }
        .timeline-state.late { color: #d29922; }
        .timeline-state.very-late { color: #f85149; }
        .timeline-track { position: relative; height: 7px; margin-top: 0.24rem; border-radius: 4px; background: #30363d; overflow: hidden; }
        .timeline-fill { height: 100%; border-radius: 4px; background-color: #58a6ff; background-image: linear-gradient(135deg, rgba(255,255,255,0.18) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.18) 50%, rgba(255,255,255,0.18) 75%, transparent 75%, transparent); background-size: 18px 18px; animation: timeline-shimmer 0.9s linear infinite; transition: width 1s linear, background-color 0.2s; }
        .timeline-fill.late { background-color: #d29922; }
        .timeline-fill.very-late { background-color: #f85149; }
        @keyframes timeline-shimmer { from { background-position: 0 0; } to { background-position: 18px 0; } }
        @media (prefers-reduced-motion: reduce) { .timeline-fill { animation: none; transition: none; } }
        .control-ok { color: #3fb950; }
        .control-warn { color: #d29922; }
        .control-error { color: #f85149; }
        .control-off { color: #6e7681; }
        .control-error-text { margin-top: 0.45rem; color: #f85149; font-size: 0.75rem; overflow-wrap: anywhere; }
        @media (max-width: 850px) { .status-header { flex-wrap: wrap; } .fleet-metrics { order: 3; flex-basis: 100%; } }
        @media (max-width: 700px) { body { padding: 1rem; } .hosts { grid-template-columns: 1fr; } }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header class="status-header">
        <a href="index.html">← Dashboard</a>
        <h1>🎵 Conductress Host Status</h1>
        <div class="fleet-metrics" id="fleetMetrics" aria-live="polite"></div>
        <label class="refresh-toggle"><input type="checkbox" id="autoRefresh" checked> Auto-refresh</label>
    </header>
    <div class="server-banner" id="serverBanner"></div>
    <div class="hosts" id="hosts"></div>
    <script src="lib/status-helpers.js"></script>
    <script>
const {formatScore, timeAgo, escapeHtml, renderFleetControl, shortSpecifier, formatDuration, queueSummary, taskDescription, renderRemoteTasks, renderLocalTasks, renderRecentResults, fmtBytes, diskTier, terminalRecheckQualifies, createRecheckScheduler} = StatusHelpers;

const HOSTS = [
    {id: 'arm', runnerId: 'armbench', title: 'AWS Graviton 3', subtitle: 'c7g.metal · 64 cores'},
    {id: 'graviton4', runnerId: 'g4bench', title: 'AWS Graviton 4', subtitle: 'c8g.metal · 192 cores'},
    {id: 'x86', runnerId: 'bench', title: 'AMD EPYC 9R14', subtitle: 'Zen 4 · 192 cores'},
    {id: 'intel', runnerId: 'intelbench', title: 'Intel Xeon Platinum 8488C', subtitle: 'Sapphire Rapids · 48 cores'},
];
const STATUS_BASE = 'https://data.conductress.rainsupreme.net/status';
const CONTROL_STATUS_URL = 'https://data.conductress.rainsupreme.net/api/v1/public/dashboard';

function renderHost(data, host, remoteTasks) {
    const reportedState = data.runner?.state || 'unreachable';
    const ageSec = data.timestamp ? (Date.now() - new Date(data.timestamp).getTime()) / 1000 : Infinity;
    const boundaryOnly = data.measurement_isolation?.boundary_publisher_active === true
        && data.measurement_isolation?.status_timer_migration_required === false;
    const boundaryTaskRunning = boundaryOnly && data.boundary?.state === 'starting';
    const warnAfter = boundaryTaskRunning ? 7200 : 300;
    const critAfter = boundaryTaskRunning ? 21600 : 1800;
    const staleWarn = ageSec > warnAfter && ageSec <= critAfter;
    const staleCrit = ageSec > critAfter;
    const stale = staleWarn || staleCrit;
    const dotClass = staleCrit ? 'stopped' : staleWarn ? 'stale' : reportedState;
    let staleBanner = '';
    if (stale) {
        const cls = staleCrit ? 'crit' : 'warn';
        const reason = boundaryTaskRunning
            ? 'no completion boundary received (task may be stuck)'
            : 'publishing may be broken (runner state unknown)';
        staleBanner = `<div class="card-banner ${cls}">⚠ No update for ${timeAgo(data.timestamp).replace(' ago','')} — ${reason}</div>`;
    }

    const disk = data.disk || {};
    const diskFree = disk.free_pct;
    const diskCls = stale ? null : diskTier(diskFree);
    let diskBanner = '';
    if (diskCls) {
        const detail = disk.avail_bytes && disk.size_bytes ? ` (${fmtBytes(disk.avail_bytes)} of ${fmtBytes(disk.size_bytes)})` : '';
        const icon = diskCls === 'crit' ? '🔴' : '⚠';
        diskBanner = `<div class="card-banner ${diskCls}">${icon} Host disk ${diskCls === 'crit' ? 'critically ' : ''}low: ${diskFree}% free${detail}</div>`;
    }
    const diskMeta = diskFree != null && !stale ? ` · disk ${diskFree}% free` : '';
    const fleetControl = renderFleetControl(data);
    const worst = staleCrit || diskCls === 'crit' || fleetControl.severity === 'crit'
        ? 'alarm-crit'
        : staleWarn || diskCls === 'warn' || fleetControl.severity === 'warn'
            ? 'alarm-warn' : '';
    const cardClass = worst ? `host-card ${worst}` : 'host-card';
    const remoteItems = remoteTasks?.remote_tasks ?? remoteTasks;
    const remoteReturned = remoteItems?.length || 0;
    const remoteCount = remoteTasks?.total_count ?? remoteReturned;
    const remoteTruncated = remoteTasks?.truncated === true;
    const remoteExpected = remoteTasks?.expected_duration_complete === false ? 0 : (remoteTasks?.expected_duration_sec || 0);
    const remoteSummary = remoteTruncated
        ? `${remoteCount} tasks · ${remoteReturned} shown`
        : queueSummary(remoteCount, remoteExpected);
    const remoteOmitted = Math.max(0, remoteCount - remoteReturned);
    const remoteDisclosure = remoteOmitted
        ? `<div class="item-meta task-snapshot-note">${remoteOmitted} additional task${remoteOmitted === 1 ? '' : 's'} not included in the public detail feed</div>`
        : '';
    const localCount = data.queue?.depth || 0;
    const localExpected = data.queue?.expected_duration_sec || 0;
    const recentCount = data.recent_results?.length || 0;

    return `<div class="${cardClass}">
        <h2><span class="status-dot ${dotClass}" role="img" aria-label="Status: ${escapeHtml(dotClass)}"></span><span class="host-title">${escapeHtml(host.title)}<span class="host-subtitle">${escapeHtml(host.runnerId)} · ${escapeHtml(host.subtitle)}</span></span></h2>
        ${staleBanner}${diskBanner}${fleetControl.banner}
        <div class="meta">${fleetControl.summary} · last boundary ${timeAgo(data.timestamp) || 'unknown'}${diskMeta}</div>
        <div class="task-flow">
            <div class="section remote" aria-label="${escapeHtml(remoteSummary)} in remote mailbox"><div class="section-title"><span>Remote mailbox</span><span class="section-count">${escapeHtml(remoteSummary)}</span></div>${renderRemoteTasks(remoteItems)}${remoteDisclosure}</div>
            <div class="section local" aria-label="${escapeHtml(queueSummary(localCount, localExpected))} in local queue"><div class="section-title"><span>Local queue</span><span class="section-count">${escapeHtml(queueSummary(localCount, localExpected))}</span></div>${renderLocalTasks(data.queue, data.boundary)}</div>
            <div class="section results" aria-label="${recentCount} recent completion${recentCount === 1 ? '' : 's'}"><div class="section-title"><span>Recent completions</span><span class="section-count">${recentCount}</span></div>${renderRecentResults(data.recent_results)}</div>
        </div>
    </div>`;
}

async function renderServerBanner() {
    const el = document.getElementById('serverBanner');
    el.className = 'server-banner';  // reset (hidden by default)
    let d;
    try {
        const resp = await fetch(`${STATUS_BASE}/_server.json?t=${Date.now()}`);
        if (!resp.ok) return;  // no disk writer deployed yet — degrade silently
        d = await resp.json();
    } catch { return; }
    const freePct = d.free_pct != null ? d.free_pct
        : (d.size_bytes ? Math.round(d.avail_bytes * 100 / d.size_bytes) : null);
    if (freePct == null) return;
    // If the disk reading itself is stale (>10min), the number can't be trusted.
    const readingStale = d.timestamp && (Date.now() - new Date(d.timestamp).getTime()) > 600000;
    if (freePct < 5) {
        el.className = 'server-banner crit';
        el.textContent = `🔴 Data server disk critically low: ${freePct}% free (${fmtBytes(d.avail_bytes)} of ${fmtBytes(d.size_bytes)}). Publishing will break when it fills — free space now.`;
    } else if (freePct < 15) {
        el.className = 'server-banner warn';
        el.textContent = `⚠ Data server disk low: ${freePct}% free (${fmtBytes(d.avail_bytes)} of ${fmtBytes(d.size_bytes)}).`;
    } else if (readingStale) {
        el.className = 'server-banner warn';
        el.textContent = `⚠ Data server disk reading is stale (last ${timeAgo(d.timestamp)}) — disk writer may be down.`;
    }
}

// Last successfully-fetched payload per host. On a transient refresh failure we
// re-render this instead of a blank placeholder, so a real alarm (disk/stale)
// never flickers away. If the host stays unreachable, the retained timestamp
// ages past the staleness threshold and escalates to the stale alarm on its own.
const lastGood = {};
let lastRemoteByRunner = null;

function fleetMetricsSnapshot(statusByHost = lastGood, remoteByRunner = lastRemoteByRunner) {
    const statuses = HOSTS.map(host => statusByHost[host.id]).filter(Boolean);
    return {
        online: statuses.filter(data => data.runner?.state === 'running').length,
        total: HOSTS.length,
        active: statuses.filter(data => data.boundary?.state === 'starting').length,
        remote: remoteByRunner === null ? null : HOSTS.reduce((sum, host) => {
            const mailbox = remoteByRunner[host.runnerId];
            return sum + (mailbox?.total_count ?? mailbox?.remote_tasks?.length ?? 0);
        }, 0),
        local: statuses.reduce((sum, data) => sum + (data.queue?.depth || 0), 0),
    };
}

function renderFleetMetrics() {
    const metrics = fleetMetricsSnapshot();
    const remoteText = metrics.remote === null ? '— remote' : `${metrics.remote} remote`;
    document.getElementById('fleetMetrics').innerHTML = `
        <span class="metric-chip ${metrics.online === metrics.total ? 'ok' : ''}">${metrics.online}/${metrics.total} online</span>
        <span class="metric-chip">${metrics.active} active</span>
        <span class="metric-chip">${remoteText}</span>
        <span class="metric-chip">${metrics.local} local</span>`;
}

function renderCachedStatus() {
    const container = document.getElementById('hosts');
    const cards = HOSTS.map(host => {
        const data = lastGood[host.id] || {runner: {state: 'unreachable'}, timestamp: new Date().toISOString()};
        const remoteTasks = lastRemoteByRunner === null ? null : (lastRemoteByRunner[host.runnerId] || []);
        return renderHost(data, host, remoteTasks);
    });
    container.innerHTML = cards.join('');
    renderFleetMetrics();
}

async function loadStatus() {
    renderServerBanner();
    try {
        const response = await fetch(`${CONTROL_STATUS_URL}?t=${Date.now()}`);
        if (response.ok) {
            const dashboardData = await response.json();
            lastRemoteByRunner = Object.fromEntries(dashboardData.runners.map(runner => [runner.runner_id, runner]));
        }
    } catch { /* feed unavailable — render an explicit unavailable state */ }

    for (const host of HOSTS) {
        let data = null;
        try {
            const resp = await fetch(`${STATUS_BASE}/${host.id}.json?t=${Date.now()}`);
            if (resp.ok) data = await resp.json();
        } catch { /* network blip — fall through to last-good */ }

        if (data) {
            lastGood[host.id] = data;
        } else if (lastGood[host.id]) {
            data = lastGood[host.id];
        } else {
            data = {runner: {state: 'unreachable'}, timestamp: new Date().toISOString()};
        }
    }
    renderCachedStatus();
}

let autoRefreshEnabled = true;
const recheckScheduler = createRecheckScheduler({
    onRecheck(hostId) {
        if (!autoRefreshEnabled) return;
        // Single follow-up fetch for the specific host, then re-render.
        const host = HOSTS.find(h => h.id === hostId);
        if (!host) return;
        fetch(`${STATUS_BASE}/${host.id}.json?t=${Date.now()}`)
            .then(r => r.ok ? r.json() : null)
            .then(data => { if (data) { lastGood[host.id] = data; renderCachedStatus(); } })
            .catch(() => {});
        // Also refresh the control dashboard feed for updated remote mailbox state.
        fetch(`${CONTROL_STATUS_URL}?t=${Date.now()}`)
            .then(r => r.ok ? r.json() : null)
            .then(dashboardData => {
                if (dashboardData) {
                    lastRemoteByRunner = Object.fromEntries(dashboardData.runners.map(runner => [runner.runner_id, runner]));
                    renderCachedStatus();
                }
            })
            .catch(() => {});
    },
    delayMs: 5000,
});

function scheduleTerminalRechecks() {
    for (const host of HOSTS) {
        const data = lastGood[host.id];
        const { qualify, boundaryKey } = terminalRecheckQualifies(data);
        if (qualify) {
            recheckScheduler.schedule(host.id, boundaryKey);
        }
    }
}

function refreshAndSchedule() {
    return loadStatus().then(() => {
        if (autoRefreshEnabled) scheduleTerminalRechecks();
    });
}

let refreshTimer = setInterval(refreshAndSchedule, 60000);
refreshAndSchedule();
setInterval(renderCachedStatus, 1000);
document.getElementById('autoRefresh').addEventListener('change', (e) => {
    autoRefreshEnabled = e.target.checked;
    if (autoRefreshEnabled) {
        refreshTimer = setInterval(refreshAndSchedule, 60000);
        refreshAndSchedule();
    } else {
        clearInterval(refreshTimer);
        recheckScheduler.reset();
    }
});
    </script>
</body>
</html>
