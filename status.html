<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conductress — Host Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }
        h1 { color: #58a6ff; margin-bottom: 1.5rem; font-size: 1.5rem; }
        .hosts { display: flex; flex-direction: column; gap: 0.85rem; max-width: 1500px; margin: 0 auto; }
        .host-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem 1.1rem; }
        .host-card h2 { font-size: 1.05rem; display: flex; align-items: flex-start; gap: 0.55rem; }
        .host-title { color: #f0f6fc; font-weight: 600; }
        .host-subtitle { display: block; color: #6e7681; font-size: 0.72rem; font-weight: 400; margin-top: 0.1rem; }
        .status-dot { width: 10px; height: 10px; margin-top: 0.35rem; flex: 0 0 auto; border-radius: 50%; display: inline-block; }
        .status-dot.running { background: #3fb950; }
        .status-dot.stopped { background: #f85149; }
        .status-dot.unreachable { background: #6e7681; }
        .status-dot.stale { background: #d29922; }
        .host-card.alarm-warn { border-color: #d29922; }
        .host-card.alarm-crit { border-color: #f85149; }
        .card-banner { padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.8rem; margin-top: 0.65rem; font-weight: 600; }
        .card-banner.warn { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid #d29922; }
        .card-banner.crit { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; }
        .server-banner { padding: 0.6rem 0.9rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; font-weight: 600; display: none; }
        .server-banner.warn { background: rgba(210,153,34,0.15); color: #d29922; border: 1px solid #d29922; display: block; }
        .server-banner.crit { background: rgba(248,81,73,0.15); color: #f85149; border: 1px solid #f85149; display: block; }
        .meta { color: #8b949e; font-size: 0.76rem; margin: 0.35rem 0 0 1.05rem; }
        .task-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-top: 0.8rem; }
        .section { min-width: 0; }
        .section-title { display: flex; justify-content: space-between; font-size: 0.7rem; text-transform: uppercase; color: #8b949e; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .section-count { color: #6e7681; }
        .item-list { list-style: none; font-size: 0.78rem; }
        .item-list li { padding: 0.38rem 0; border-top: 1px solid #21262d; min-width: 0; }
        .item-description { color: #c9d1d9; overflow-wrap: anywhere; line-height: 1.25; }
        .item-meta { color: #6e7681; font-size: 0.69rem; margin-top: 0.12rem; overflow-wrap: anywhere; }
        .empty-list { color: #6e7681; font-size: 0.76rem; padding: 0.38rem 0; border-top: 1px solid #21262d; }
        .score { color: #3fb950; font-weight: 600; }
        .control-ok { color: #3fb950; }
        .control-warn { color: #d29922; }
        .control-error { color: #f85149; }
        .control-off { color: #6e7681; }
        .control-error-text { margin-top: 0.45rem; color: #f85149; font-size: 0.75rem; overflow-wrap: anywhere; }
        @media (max-width: 900px) { .task-columns { grid-template-columns: 1fr; gap: 0.7rem; } }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .nav { margin-bottom: 1.5rem; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="nav"><a href="index.html">← Performance Dashboard</a> <label style="float:right;font-size:0.8rem;cursor:pointer"><input type="checkbox" id="autoRefresh" checked> Auto-refresh (60s)</label></div>
    <h1>🎵 Conductress — Host Status</h1>
    <div class="server-banner" id="serverBanner"></div>
    <div class="hosts" id="hosts"></div>
    <script>
const HOSTS = [
    {id: 'arm', runnerId: 'armbench', title: 'AWS Graviton 3', subtitle: 'c7g.metal · 64 cores'},
    {id: 'graviton4', runnerId: 'g4bench', title: 'AWS Graviton 4', subtitle: 'c8g.metal · 192 cores'},
    {id: 'x86', runnerId: 'bench', title: 'AMD EPYC 9R14', subtitle: 'Zen 4 · 192 cores'},
    {id: 'intel', runnerId: 'intelbench', title: 'Intel Xeon Platinum 8488C', subtitle: 'Sapphire Rapids · 48 cores'},
];
const STATUS_BASE = 'https://data.conductress.rainsupreme.net/status';
const CONTROL_STATUS_URL = 'https://data.conductress.rainsupreme.net/api/v1/public/dashboard';

function formatScore(score, method) {
    if (!score) return '—';
    if (method === 'latency') return score.toFixed(0) + 'µs';
    if (score > 1e6) return (score / 1e6).toFixed(2) + 'M';
    if (score > 1e3) return (score / 1e3).toFixed(1) + 'K';
    return score.toFixed(1);
}

function timeAgo(str) {
    if (!str) return '';
    // Handle Conductress format: "2026.05.24_02.28.19.311128"
    let d = new Date(str);
    if (isNaN(d)) {
        const m = str.match(/^(\d{4})\.(\d{2})\.(\d{2})_(\d{2})\.(\d{2})\.(\d{2})/);
        if (m) d = new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]}Z`);
    }
    const diff = (Date.now() - d.getTime()) / 1000;
    if (isNaN(diff)) return '';
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return Math.floor(diff / 86400) + 'd ago';
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>'"]/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
    })[ch]);
}

function renderFleetControl(data) {
    const fc = data.fleet_control;
    const iso = data.measurement_isolation || {};
    if (!fc) {
        return {summary: '<span class="control-off">Control not enabled</span>', banner: '', severity: null};
    }

    const reachable = fc.control_reachable;
    const reachClass = reachable === true ? 'control-ok' : reachable === false ? 'control-error' : 'control-off';
    const reachText = reachable === true ? 'control healthy' : reachable === false ? 'control unreachable' : 'control not contacted';
    const pending = fc.pending_outcomes_count || 0;
    const timerMigration = iso.status_timer_migration_required;
    const boundaryOnly = iso.boundary_publisher_active && !timerMigration;

    let severity = null;
    let banner = '';
    if (fc.mode !== 'off' && reachable === false) {
        severity = (fc.claim_failures_consecutive || 0) >= 3 ? 'crit' : 'warn';
        const pendingDetail = pending ? ` · ${pending} pending outcome${pending === 1 ? '' : 's'}` : '';
        banner = `<div class="card-banner ${severity}">⚠ Fleet control unreachable (${fc.claim_failures_consecutive || 1} consecutive boundary failure${(fc.claim_failures_consecutive || 1) === 1 ? '' : 's'})${pendingDetail}</div>`;
    } else if (pending > 0) {
        severity = 'warn';
        banner = `<div class="card-banner warn">⚠ ${pending} terminal outcome${pending === 1 ? '' : 's'} pending control-plane delivery</div>`;
    } else if (timerMigration) {
        severity = 'warn';
        banner = '<div class="card-banner warn">⚠ Periodic status timer migration still required</div>';
    }

    const summary = `<span class="${reachClass}">${escapeHtml(fc.mode || 'off')} · ${reachText}</span>`
        + (boundaryOnly ? ' · boundary-only' : '');
    return {summary, banner, severity};
}

function shortSpecifier(value) {
    const text = String(value || '');
    return text.length > 8 ? `${text.slice(0, 8)}…` : text;
}

function formatDuration(seconds) {
    if (seconds == null || !Number.isFinite(Number(seconds)) || Number(seconds) < 0) return '—';
    const total = Math.round(Number(seconds));
    const hours = Math.floor(total / 3600);
    const minutes = Math.floor((total % 3600) / 60);
    const remainder = total % 60;
    if (hours) return `${hours}h ${minutes}m`;
    if (minutes) return `${minutes}m ${remainder}s`;
    return `${remainder}s`;
}

function queueSummary(count, expectedSeconds) {
    const countText = `${count} task${count === 1 ? '' : 's'}`;
    return expectedSeconds > 0 ? `${countText} · ~${formatDuration(expectedSeconds)} total` : countText;
}

function taskDescription(task) {
    return escapeHtml(task.note || task.specifier || task.type || 'Unnamed task');
}

function renderRemoteTasks(tasks) {
    if (tasks === null) return '<p class="empty-list control-warn">Mailbox feed unavailable</p>';
    if (!tasks.length) return '<p class="empty-list">Empty</p>';
    return `<ul class="item-list">${tasks.slice(0, 5).map(task => {
        const source = task.source && task.specifier ? `${task.source}@${shortSpecifier(task.specifier)}` : task.source || shortSpecifier(task.specifier);
        const expected = task.expected_duration_sec != null ? `expected ${formatDuration(task.expected_duration_sec)}` : null;
        const priority = task.priority != null ? `priority ${task.priority}` : null;
        const meta = [task.state, task.type, source, priority, expected].filter(Boolean).map(escapeHtml).join(' · ');
        return `<li><div class="item-description">${taskDescription(task)}</div><div class="item-meta">${meta}</div></li>`;
    }).join('')}</ul>${tasks.length > 5 ? `<div class="item-meta">+${tasks.length - 5} more</div>` : ''}`;
}

function renderLocalTasks(queue) {
    const tasks = queue?.tasks || [];
    if (!tasks.length) return '<p class="empty-list">Empty</p>';
    return `<ul class="item-list">${tasks.slice(0, 5).map(task => {
        const source = task.source && task.specifier ? `${task.source}@${shortSpecifier(task.specifier)}` : task.source || shortSpecifier(task.specifier);
        const expected = task.expected_duration_sec != null ? `expected ${formatDuration(task.expected_duration_sec)}` : null;
        const meta = [task.type, source, expected].filter(Boolean).map(escapeHtml).join(' · ');
        return `<li><div class="item-description">${taskDescription(task)}</div><div class="item-meta">${meta}</div></li>`;
    }).join('')}</ul>${queue.depth > 5 ? `<div class="item-meta">+${queue.depth - 5} more</div>` : ''}`;
}

function renderRecentResults(results) {
    if (!results?.length) return '<p class="empty-list">None</p>';
    return `<ul class="item-list">${results.slice(0, 5).map(result => {
        const score = `<span class="score">${formatScore(result.score, result.method)}</span>`;
        const observed = result.observed_duration_sec != null
            ? `observed ${escapeHtml(formatDuration(result.observed_duration_sec))}`
            : 'duration unavailable';
        const meta = [escapeHtml(result.method || ''), escapeHtml(shortSpecifier(result.commit)), score, observed, escapeHtml(timeAgo(result.completed))].filter(Boolean).join(' · ');
        return `<li><div class="item-description">${taskDescription(result)}</div><div class="item-meta">${meta}</div></li>`;
    }).join('')}</ul>`;
}

function renderHost(data, host, remoteTasks) {
    const reportedState = data.runner?.state || 'unreachable';
    const ageSec = data.timestamp ? (Date.now() - new Date(data.timestamp).getTime()) / 1000 : Infinity;
    const boundaryOnly = data.measurement_isolation?.boundary_publisher_active === true
        && data.measurement_isolation?.status_timer_migration_required === false;
    const boundaryTaskRunning = boundaryOnly && data.boundary?.state === 'starting';
    const warnAfter = boundaryTaskRunning ? 7200 : 300;
    const critAfter = boundaryTaskRunning ? 21600 : 1800;
    const staleWarn = ageSec > warnAfter && ageSec <= critAfter;
    const staleCrit = ageSec > critAfter;
    const stale = staleWarn || staleCrit;
    const dotClass = staleCrit ? 'stopped' : staleWarn ? 'stale' : reportedState;
    let staleBanner = '';
    if (stale) {
        const cls = staleCrit ? 'crit' : 'warn';
        const reason = boundaryTaskRunning
            ? 'no completion boundary received (task may be stuck)'
            : 'publishing may be broken (runner state unknown)';
        staleBanner = `<div class="card-banner ${cls}">⚠ No update for ${timeAgo(data.timestamp).replace(' ago','')} — ${reason}</div>`;
    }

    const disk = data.disk || {};
    const diskFree = disk.free_pct;
    const diskCls = stale ? null : diskTier(diskFree);
    let diskBanner = '';
    if (diskCls) {
        const detail = disk.avail_bytes && disk.size_bytes ? ` (${fmtBytes(disk.avail_bytes)} of ${fmtBytes(disk.size_bytes)})` : '';
        const icon = diskCls === 'crit' ? '🔴' : '⚠';
        diskBanner = `<div class="card-banner ${diskCls}">${icon} Host disk ${diskCls === 'crit' ? 'critically ' : ''}low: ${diskFree}% free${detail}</div>`;
    }
    const diskMeta = diskFree != null && !stale ? ` · disk ${diskFree}% free` : '';
    const fleetControl = renderFleetControl(data);
    const worst = staleCrit || diskCls === 'crit' || fleetControl.severity === 'crit'
        ? 'alarm-crit'
        : staleWarn || diskCls === 'warn' || fleetControl.severity === 'warn'
            ? 'alarm-warn' : '';
    const cardClass = worst ? `host-card ${worst}` : 'host-card';
    const remoteItems = remoteTasks?.remote_tasks ?? remoteTasks;
    const remoteCount = remoteItems?.length || 0;
    const remoteExpected = remoteTasks?.expected_duration_sec || 0;
    const localCount = data.queue?.depth || 0;
    const localExpected = data.queue?.expected_duration_sec || 0;
    const recentCount = data.recent_results?.length || 0;

    return `<div class="${cardClass}">
        <h2><span class="status-dot ${dotClass}" role="img" aria-label="Status: ${escapeHtml(dotClass)}"></span><span class="host-title">${escapeHtml(host.title)}<span class="host-subtitle">${escapeHtml(host.runnerId)} · ${escapeHtml(host.subtitle)}</span></span></h2>
        ${staleBanner}${diskBanner}${fleetControl.banner}
        <div class="meta">${fleetControl.summary} · last boundary ${timeAgo(data.timestamp) || 'unknown'}${diskMeta}</div>
        <div class="task-columns">
            <div class="section" aria-label="${escapeHtml(queueSummary(remoteCount, remoteExpected))} in remote mailbox"><div class="section-title"><span>Remote mailbox</span><span class="section-count">${escapeHtml(queueSummary(remoteCount, remoteExpected))}</span></div>${renderRemoteTasks(remoteItems)}</div>
            <div class="section" aria-label="${escapeHtml(queueSummary(localCount, localExpected))} in local queue"><div class="section-title"><span>Local queue</span><span class="section-count">${escapeHtml(queueSummary(localCount, localExpected))}</span></div>${renderLocalTasks(data.queue)}</div>
            <div class="section" aria-label="${recentCount} recent completion${recentCount === 1 ? '' : 's'}"><div class="section-title"><span>Recent completions</span><span class="section-count">${recentCount}</span></div>${renderRecentResults(data.recent_results)}</div>
        </div>
    </div>`;
}

function fmtBytes(b) {
    if (b >= 1e9) return (b / 1e9).toFixed(1) + ' GB';
    if (b >= 1e6) return (b / 1e6).toFixed(0) + ' MB';
    return b + ' B';
}

// Disk alarm tier from free percent: 'crit' <5%, 'warn' <15%, else null (healthy).
function diskTier(freePct) {
    if (freePct == null) return null;
    if (freePct < 5) return 'crit';
    if (freePct < 15) return 'warn';
    return null;
}

async function renderServerBanner() {
    const el = document.getElementById('serverBanner');
    el.className = 'server-banner';  // reset (hidden by default)
    let d;
    try {
        const resp = await fetch(`${STATUS_BASE}/_server.json?t=${Date.now()}`);
        if (!resp.ok) return;  // no disk writer deployed yet — degrade silently
        d = await resp.json();
    } catch { return; }
    const freePct = d.free_pct != null ? d.free_pct
        : (d.size_bytes ? Math.round(d.avail_bytes * 100 / d.size_bytes) : null);
    if (freePct == null) return;
    // If the disk reading itself is stale (>10min), the number can't be trusted.
    const readingStale = d.timestamp && (Date.now() - new Date(d.timestamp).getTime()) > 600000;
    if (freePct < 5) {
        el.className = 'server-banner crit';
        el.textContent = `🔴 Data server disk critically low: ${freePct}% free (${fmtBytes(d.avail_bytes)} of ${fmtBytes(d.size_bytes)}). Publishing will break when it fills — free space now.`;
    } else if (freePct < 15) {
        el.className = 'server-banner warn';
        el.textContent = `⚠ Data server disk low: ${freePct}% free (${fmtBytes(d.avail_bytes)} of ${fmtBytes(d.size_bytes)}).`;
    } else if (readingStale) {
        el.className = 'server-banner warn';
        el.textContent = `⚠ Data server disk reading is stale (last ${timeAgo(d.timestamp)}) — disk writer may be down.`;
    }
}

// Last successfully-fetched payload per host. On a transient refresh failure we
// re-render this instead of a blank placeholder, so a real alarm (disk/stale)
// never flickers away. If the host stays unreachable, the retained timestamp
// ages past the staleness threshold and escalates to the stale alarm on its own.
const lastGood = {};

async function loadStatus() {
    renderServerBanner();
    const container = document.getElementById('hosts');
    const cards = [];
    let remoteByRunner = null;
    try {
        const response = await fetch(`${CONTROL_STATUS_URL}?t=${Date.now()}`);
        if (response.ok) {
            const dashboardData = await response.json();
            remoteByRunner = Object.fromEntries(dashboardData.runners.map(runner => [runner.runner_id, runner]));
        }
    } catch { /* feed unavailable — render an explicit unavailable state */ }

    for (const host of HOSTS) {
        let data = null;
        try {
            const resp = await fetch(`${STATUS_BASE}/${host.id}.json?t=${Date.now()}`);
            if (resp.ok) data = await resp.json();
        } catch { /* network blip — fall through to last-good */ }

        if (data) {
            lastGood[host.id] = data;
        } else if (lastGood[host.id]) {
            data = lastGood[host.id];
        } else {
            data = {runner: {state: 'unreachable'}, timestamp: new Date().toISOString()};
        }
        const remoteTasks = remoteByRunner === null ? null : (remoteByRunner[host.runnerId] || []);
        cards.push(renderHost(data, host, remoteTasks));
    }
    container.innerHTML = cards.join('');
}

loadStatus();
let refreshTimer = setInterval(loadStatus, 60000);
document.getElementById('autoRefresh').addEventListener('change', (e) => {
    if (e.target.checked) { refreshTimer = setInterval(loadStatus, 60000); loadStatus(); }
    else { clearInterval(refreshTimer); }
});
    </script>
</body>
</html>
