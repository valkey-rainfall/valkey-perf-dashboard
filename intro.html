<!DOCTYPE html>
<!-- BRIEF: Conductress 80s "sign-on" animation -- the dashboard's loading-screen cut.
     Derived from the brand kit's production cut (brand/motion/conductress-signon.html in the
     Conductress repo). This copy carries exactly one score (COSMOS) and no CRT overlay, draws
     full-bleed, and shows its text in one go (Rain, Oct 19 2026). A ~5.8s title sequence in the
     tradition of Cinemaware / Sierra / Amiga cracktro openings, built on the chosen lockup
     (variant H: keyhole C-mark leading a hexagon speed trail, sunset palette, hard-edged circle
     glow, A's sky+grid).

     TIMELINE (seconds)
       0.00  black
       0.30  grid horizon draws itself out from the vanishing point, WHITE-HOT, cooling to
             amber/violet as it goes (a hot stroke layer over the cool one, colour-animated);
             the horizon rule runs edge to edge whatever the window's aspect ratio
       0.80  trail hexes scream in from off-screen left, heavy motion blur, hard ease-out
       1.55  lead C snaps into place (with the hex that masks the trail behind it). A WHITE
             version of the C flares over it and fades, while a burst of rotating four-point
             SPARKLES (bloomed) plays across the mark.
       1.80  the C's seven stripes fill bottom-up like a VU meter, one tick each
       2.70  CONDUCTRESS slams in as ONE word (scale 3 -> 1), chromatic split -> converge
       3.05  subtitle appears whole, block cursor blinking after it
       3.05  ...hold. The text stays up for the time the old letter-by-letter typing took.
       5.80  done mark (embed): the parent may release the frame from here.

     FULL-BLEED: the SVG viewBox stays 0 0 900 340 (every animation's transform-origin depends
     on it) and the root <svg> has overflow:visible, so the sky, stars, far mountain ranges and
     grid rays are drawn well outside the box and the viewport crops them. The star field is
     generated at load (IntroHelpers.starField): none over the sun, washed out in the sunset glow,
     denser and brighter with distance from it, thinning toward the horizon. ?stars=N&starsize=S&
     starwash=FROM,TO override the count, radius scale and glow wash band for tuning. The 900x340 core is
     sized min(100vw, 177.7vh), so on 16:9 the word is as large as before and the old letterbox
     bars are now scenery; portrait and ultrawide windows get more sky / more ground.

     AUDIO: synthesised live in WebAudio. COSMOS: sub drone, slow chorused pads on
       quartal/Lydian voicings (Cmaj9 -> Fmaj7#11 -> Gadd9 -> C Lydian), FM glass bells on a
       pentatonic, long 5s reverb, no percussion at all. The infinite empty cosmos.
     Browsers refuse audio without a gesture, so the standalone page starts on a click: PRESS START.

     EMBED (dashboard loading screen): ?embed=1&sound=auto|on|off
            Hides PRESS START and REPLAY, starts at once, and talks to the parent window with
            postMessage {type:'conductress-intro', event:'ready'|'autoplay'|'audio'|'done'|'skip'|'restart'|'audio-ended'}.
            'done' fires at T.embedDone; the parent releases the frame at max(charts ready, done).
            Sound: the browser is asked whether audio may start without a gesture
            (navigator.getAutoplayPolicy where it exists, else an AudioContext resume probe, <=250 ms,
            the visuals wait for the answer on the black opening frame). The verdict is posted as
            'autoplay' {allowed, mode} and logged to the console. sound=auto plays the score only if
            allowed and otherwise stays silent with no button; sound=on additionally offers a SOUND
            button whose click restarts the sequence from power-on with the score (a refused
            AudioContext has no advancing clock, so a mid-timeline join is not schedulable).
            Clicking anywhere else asks the parent to skip. The parent sends {cmd:'release',
            keepAudio, ms}: keepAudio lets a playing score finish under the dashboard (the score
            stays audible past 7 s so Chrome's media-engagement index counts the visit and learns to
            allow autoplay here); otherwise the output gain rides the visual fade down.

     DEBUG: ?t=2.5 pauses every animation at t=2.5s (Web Animations API) for frame capture.
            ?run=1 starts the sequence + schedules the score without a gesture (audio stays
            suspended, but any scheduling exception surfaces in the console).
     Sunset palette: #ffe08a #ffc94a #ff7a3d #ff2d7e #6d3bd8 on #150c26. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CONDUCTRESS — sign-on</title>
<style>
  :root { --bg:#150c26; --cream:#fff6ea; --amber:#ffc94a; --mag:#ff2d7e; --vio:#6d3bd8; --gold:#c9a86e; }
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}
  #stage{position:fixed;inset:0;display:grid;place-items:center;background:#000;overflow:hidden}
  /* the 900x340 core fills the width (height-capped on ultrawide); the scenery outside the
     viewBox is visible through overflow:visible and cropped by #stage */
  svg#art{width:min(100vw,177.7vh);height:auto;display:block;overflow:visible}

  /* everything parks in its "before" state; .play starts the clocks.
     NOTE: never use the `animation:` shorthand below -- it resets fill-mode/play-state and
     overrides this class. Longhands only. */
  .anim{animation-play-state:paused;animation-fill-mode:both}
  .play .anim{animation-play-state:running}

  #sky   {animation-name:fadein;animation-duration:.6s;animation-timing-function:ease-out;animation-delay:0s}
  #stars {animation-name:fadein;animation-duration:1.4s;animation-timing-function:ease-out;animation-delay:.2s}
  #mountains{animation-name:fadein;animation-duration:.9s;animation-timing-function:ease-out;animation-delay:.3s}
  #glow,#leadmask circle{transform-origin:450px 110px;animation-name:glowup;animation-duration:.9s;animation-timing-function:cubic-bezier(.2,.9,.2,1);animation-delay:1.55s}

  /* grid: cool layer draws; hot layer draws on top, white -> amber -> gone.
     The rays run to the edge of the extended scenery (longest 3331 units), so the dash is 3600 and
     the draw lasts 3x the old 1200/1.1s: with this ease-out the core 134 units still draw in the
     first ~0.25s, the rest continues outward off the core. The hot layer's colour cooling is a
     SEPARATE 2.2s animation so the core cools on the old schedule whatever the tip is doing. */
  #hlines line{stroke-dasharray:3600;stroke-dashoffset:3600;animation-name:draw;animation-duration:3.3s;animation-timing-function:cubic-bezier(.3,.7,.1,1);animation-delay:.3s}
  /* the horizon rule is two halves drawing out from the vanishing point to the scenery edges (3150
     units each); dash 3200, ease-out over 3.2s puts the tip past the window edge at ~0.3s on 16:9
     and ~0.4s on 32:9, then it keeps going off-screen. The hot pass cools on the rays' 2.2s clock. */
  #hrule line{stroke-dasharray:3200;stroke-dashoffset:3200;animation-name:draw;animation-duration:3.2s;animation-timing-function:ease-out;animation-delay:.35s}
  #hot line{stroke-dasharray:3600;stroke-dashoffset:3600;animation-name:draw,coolhot;animation-duration:3.3s,2.2s;animation-timing-function:cubic-bezier(.3,.7,.1,1),cubic-bezier(.3,.7,.1,1);animation-delay:.3s,.3s}
  #hotrule line{stroke-dasharray:3200;stroke-dashoffset:3200;animation-name:draw,coolhot;animation-duration:3.2s,2.2s;animation-timing-function:ease-out,cubic-bezier(.3,.7,.1,1);animation-delay:.35s,.35s}

  #trail path{animation-name:flyin;animation-duration:.75s;animation-timing-function:cubic-bezier(.05,.9,.15,1)}
  #trail path:nth-child(1){animation-delay:.80s} #trail path:nth-child(2){animation-delay:.83s}
  #trail path:nth-child(3){animation-delay:.86s} #trail path:nth-child(4){animation-delay:.89s}
  #trail path:nth-child(5){animation-delay:.92s} #trail path:nth-child(6){animation-delay:.95s}
  #trail path:nth-child(7){animation-delay:.98s} #trail path:nth-child(8){animation-delay:1.01s}
  #trail path:nth-child(9){animation-delay:1.04s} #trail path:nth-child(10){animation-delay:1.07s}
  #streaks{animation-name:streak;animation-duration:.9s;animation-timing-function:ease-out;animation-delay:.85s}

  /* the mask hex (sky + glow, clipped to the lead hex) snaps in WITH the C: before the C arrives
     there is nothing to mask, and a sky-coloured hex over the fading-in sky read as a hole */
  #lead,#leadmask{animation-name:snap;animation-duration:.45s;animation-timing-function:cubic-bezier(.1,1.4,.3,1);animation-delay:1.55s}
  #flare {transform-origin:540px 110px;animation-name:flare;animation-duration:1.1s;animation-timing-function:ease-out;animation-delay:1.55s}
  /* sparkles: eight, one every 0.19s on the arpeggio grid, each living 1.3s so 2-3 overlap; DOM order sweeps bottom -> top.
     Delays key off the positioning WRAPPER (#sparks > g), because each .sp is the only child of its wrapper
     and .sp:nth-child(N) would match all-or-nothing. Linear timing: rotation is continuous, scale ease lives in the keyframes. */
  #sparks .sp{transform-box:fill-box;transform-origin:50% 50%;animation-name:sparkle;animation-duration:1.3s;animation-timing-function:linear}
  #sparks > g:nth-child(1) .sp{animation-delay:1.52s} #sparks > g:nth-child(2) .sp{animation-delay:1.71s}
  #sparks > g:nth-child(3) .sp{animation-delay:1.90s} #sparks > g:nth-child(4) .sp{animation-delay:2.09s}
  #sparks > g:nth-child(5) .sp{animation-delay:2.28s} #sparks > g:nth-child(6) .sp{animation-delay:2.47s}
  #sparks > g:nth-child(7) .sp{animation-delay:2.66s} #sparks > g:nth-child(8) .sp{animation-delay:2.85s}

  #stripes rect{transform-box:fill-box;transform-origin:50% 100%;animation-name:vu;animation-duration:.16s;animation-timing-function:cubic-bezier(.2,1.6,.4,1)}
  #stripes rect:nth-child(7){animation-delay:1.80s} #stripes rect:nth-child(6){animation-delay:1.93s}
  #stripes rect:nth-child(5){animation-delay:2.06s} #stripes rect:nth-child(4){animation-delay:2.19s}
  #stripes rect:nth-child(3){animation-delay:2.32s} #stripes rect:nth-child(2){animation-delay:2.45s}
  #stripes rect:nth-child(1){animation-delay:2.58s}

  /* the word slams in as one unit about its own centre; the chromatic ghosts follow it in */
  #word .w{transform-box:fill-box;transform-origin:50% 50%;animation-name:slam;animation-duration:.42s;animation-timing-function:cubic-bezier(.1,1.2,.2,1);animation-delay:2.70s}
  #word .r,#word .b{animation-name:split;animation-duration:.55s;animation-timing-function:ease-out;animation-delay:3.0s}

  /* subtitle appears whole; the block cursor rests after it and blinks (no typing) */
  #sub  {animation-name:fadein;animation-duration:.22s;animation-timing-function:ease-out;animation-delay:3.05s}
  #cursor{animation-name:fadein,blink;animation-duration:.01s,.5s;animation-timing-function:steps(1,end),steps(1,end);animation-delay:3.05s,3.3s;animation-iteration-count:1,infinite;animation-fill-mode:both,none}

  @keyframes fadein{from{opacity:0}to{opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes coolhot{0%{stroke:#ffffff;opacity:1}
                     45%{stroke:#fff1c4;opacity:1}
                     65%{stroke:#ffb45c;opacity:.7}
                     100%{stroke:#ff2d7e;opacity:0}}
  @keyframes glowup{from{opacity:0;transform:scale(.4)}to{opacity:.07;transform:scale(1)}}
  @keyframes flyin{0%{transform:translateX(-1300px);filter:blur(0);opacity:0}
                   10%{opacity:1;filter:blur(3px)}
                   70%{filter:blur(2px)}
                   100%{transform:translateX(0);filter:blur(0);opacity:var(--op)}}
  @keyframes streak{0%{opacity:0;transform:translateX(-500px)}30%{opacity:1}100%{opacity:0;transform:translateX(120px)}}
  @keyframes snap{0%{opacity:0;transform:translateX(-900px) scaleX(2.4)}60%{opacity:1;transform:translateX(14px) scaleX(.94)}100%{opacity:1;transform:none}}
  @keyframes flare{0%{opacity:0;transform:scale(1.35)}18%{opacity:1;transform:scale(1.04)}100%{opacity:0;transform:scale(1)}}
  @keyframes sparkle{0%{opacity:1;transform:scale(0) rotate(0deg)}
                     18%{transform:scale(1.15) rotate(40deg)}
                     35%{transform:scale(1) rotate(78deg)}
                     70%{transform:scale(.85) rotate(155deg)}
                     100%{opacity:1;transform:scale(0) rotate(220deg)}}
  @keyframes vu{from{transform:scaleY(0);opacity:0}to{transform:scaleY(1);opacity:1}}
  @keyframes slam{0%{opacity:0;transform:scale(3.2) translateY(-30px)}55%{opacity:1;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
  @keyframes split{0%{opacity:0;transform:translateX(var(--dx))}12%{opacity:.9}100%{opacity:.75;transform:translateX(var(--dx0))}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  /* ---------- chrome ---------- */
  #ui{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.72);color:var(--cream);
      font-family:'SF Mono',Menlo,Consolas,monospace;letter-spacing:.18em;text-align:center;transition:opacity .3s}
  #ui.hidden{opacity:0;pointer-events:none}
  #ui button{background:none;border:2px solid var(--amber);color:var(--amber);font:inherit;letter-spacing:.3em;padding:14px 34px;cursor:pointer;margin:10px}
  #ui button:hover{background:var(--amber);color:#150c26}
  #replay{position:fixed;right:18px;bottom:14px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.25em;
      color:#6d5f92;background:none;border:1px solid #2a1d4a;padding:6px 12px;cursor:pointer;opacity:0;transition:opacity .4s}
  .play #replay{opacity:1;transition-delay:6s}

  /* ---------- embed mode (dashboard loading screen) ---------- */
  .embed #replay,.embed #ui{display:none}
  #soundhint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;
      font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px;letter-spacing:.25em;color:var(--amber);
      background:rgba(21,12,38,.72);border:1px solid #6d5f92;padding:8px 16px;cursor:pointer;opacity:0;transition:opacity .4s}
  .embed.offersound #soundhint{display:block;opacity:.9}
  .embed.offersound.audio #soundhint,.embed.released #soundhint{opacity:0;pointer-events:none}
  #soundhint:hover{border-color:var(--amber);color:var(--cream)}
</style>
</head>
<body>
<div id="stage">
<svg id="art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Conductress sign-on animation">
  <defs>
    <!-- sky: the same ellipse the 900x340 cut had (centre 450,129; radii 648 x 245), pinned in user
         space so the rect can grow to the scenery box without the gradient stretching with it -->
    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="450" cy="129" r="648" gradientTransform="matrix(1 0 0 .378 0 80.2)">
      <stop offset="0%" stop-color="#2a1140"/><stop offset="60%" stop-color="#150c26"/><stop offset="100%" stop-color="#07040d"/>
    </radialGradient>
    <linearGradient id="trailg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d3bd8"/><stop offset="55%" stop-color="#ff2d7e"/><stop offset="100%" stop-color="#ffc94a"/>
    </linearGradient>
    <linearGradient id="csun" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="96">
      <stop offset="0%" stop-color="#ffe08a"/><stop offset="28%" stop-color="#ffc94a"/><stop offset="56%" stop-color="#ff7a3d"/>
      <stop offset="82%" stop-color="#ff2d7e"/><stop offset="100%" stop-color="#6d3bd8"/>
    </linearGradient>
    <!-- grid rays fade from the horizon to y=420 (the bottom of a 16:9 window at full width), then stay faint -->
    <linearGradient id="gridg" gradientUnits="userSpaceOnUse" x1="0" y1="196" x2="0" y2="420">
      <stop offset="0%" stop-color="#ff7a3d" stop-opacity="0.5"/><stop offset="100%" stop-color="#6d3bd8" stop-opacity="0.05"/>
    </linearGradient>
    <!-- horizon rule: the core's violet -> magenta -> amber sweep pinned in user space (the old 60..840
         run), opaque out to both scenery edges so it meets the window edge at any aspect ratio -->
    <linearGradient id="ruleg" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="840" y2="0">
      <stop offset="0%" stop-color="#6d3bd8"/><stop offset="25%" stop-color="#ff2d7e"/>
      <stop offset="75%" stop-color="#ffc94a"/><stop offset="100%" stop-color="#ffc94a"/>
    </linearGradient>
    <linearGradient id="streakg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d3bd8" stop-opacity="0"/><stop offset="60%" stop-color="#ff2d7e" stop-opacity="0.5"/><stop offset="100%" stop-color="#ffc94a" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="sparkglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/><stop offset="30%" stop-color="#fff3d0" stop-opacity="0.7"/><stop offset="65%" stop-color="#ffc94a" stop-opacity="0.25"/><stop offset="100%" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- hot-grid glow. The region is pinned in user space to the area any window between 9:16 and
         32:9 can show: left to the group's bounding box (the whole 6300x1600 scenery) Chromium's
         filter surface overflows and leaves a black tile near the origin. Beyond the region the hot
         pass (2.2 s, cooling out) is simply not drawn; the cool rays underneath still are. -->
    <filter id="hotglow" filterUnits="userSpaceOnUse" x="-700" y="120" width="2400" height="900">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="flareblur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sparkbloom" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="wide"/><feGaussianBlur stdDeviation="2" result="tight"/>
      <feMerge><feMergeNode in="wide"/><feMergeNode in="wide"/><feMergeNode in="tight"/><feMergeNode in="tight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cpath"><path d="M89.8 27 L50 4 L10.2 27 L10.2 73 L50 96 L89.8 73 L89.8 61 L69.05 61 A22 22 0 1 1 69.05 39 L89.8 39 Z"/></clipPath>
    <clipPath id="leadclip"><path d="M540 52 L590.2 81 L590.2 139 L540 168 L489.8 139 L489.8 81 Z"/></clipPath>
    <!-- four-point diffraction sparkle: long thin spikes, a short cross, a soft core -->
    <symbol id="spark" viewBox="-20 -20 40 40" overflow="visible">
      <circle r="16" fill="url(#sparkglow)"/>
      <path d="M0 -19 L1.3 -1.3 L19 0 L1.3 1.3 L0 19 L-1.3 1.3 L-19 0 L-1.3 -1.3 Z" fill="#ffffff"/>
      <path d="M0 -8 L.7 -.7 L8 0 L.7 .7 L0 8 L-.7 .7 L-8 0 L-.7 -.7 Z" fill="#fff6ea" transform="rotate(45)"/>
    </symbol>
  </defs>

  <!-- scenery box: x -2700..3600, y -1400..1800 (the 900x340 core sits at the origin) -->
  <rect x="-2700" y="-1400" width="6300" height="3200" fill="#000"/>
  <g id="sky" class="anim"><rect x="-2700" y="-1400" width="6300" height="3200" fill="url(#sky)"/></g>
  <!-- night sky: tens of thousands of stars generated at load (IntroHelpers.starField, lib/intro-helpers.js)
       as one <path> of dots per brightness/tint step. None over the sun's disc, washed out in the
       sunset glow, thinning toward the horizon, densest high up; fading in with the sky. -->
  <g id="stars" class="anim" stroke-linecap="round"></g>
  <!-- the sun: a hard-edged circle glow, in front of the stars -->
  <circle id="glow" class="anim" cx="450" cy="110" r="150" fill="#ff7a3d"/>
  <!-- small distant ranges either side of the road, darker than the sky, sitting on the horizon;
       the first two are the core's, the next two carry the ridge to the scenery edges -->
  <g id="mountains" class="anim" fill="#07040c">
    <path d="M0 196 L38 186 L74 191 L112 178 L146 189 L184 181 L221 190 L258 183 L292 191 L326 187 L360 194 L385 196 Z"/>
    <path d="M515 196 L540 194 L568 189 L606 183 L640 190 L676 180 L712 189 L748 176 L786 188 L820 182 L858 190 L900 185 L900 196 Z"/>
    <path d="M-2700 196 L-2700 177 L-2657 189 L-2624 190 L-2580 189 L-2542 190 L-2513 189 L-2467 183 L-2421 180 L-2385 183 L-2351 189 L-2314 181 L-2270 185 L-2231 182 L-2187 189 L-2141 180 L-2111 185 L-2079 189 L-2037 188 L-1996 193 L-1951 190 L-1907 194 L-1862 185 L-1829 193 L-1790 179 L-1760 188 L-1728 190 L-1695 186 L-1657 180 L-1622 181 L-1592 193 L-1545 185 L-1503 179 L-1470 188 L-1431 187 L-1399 187 L-1369 179 L-1338 194 L-1298 176 L-1260 189 L-1219 176 L-1187 183 L-1144 183 L-1114 181 L-1085 190 L-1048 178 L-1006 180 L-971 188 L-931 184 L-887 189 L-843 185 L-808 192 L-779 181 L-735 187 L-704 190 L-661 190 L-615 191 L-582 181 L-540 179 L-494 184 L-449 185 L-417 181 L-378 192 L-338 190 L-305 189 L-271 189 L-232 193 L-189 181 L-159 189 L-115 183 L-74 193 L-31 183 L0 196 Z"/>
    <path d="M900 196 L900 188 L939 183 L975 194 L1016 189 L1050 188 L1084 179 L1118 190 L1147 190 L1189 192 L1234 191 L1272 184 L1312 186 L1342 180 L1372 184 L1403 184 L1449 183 L1492 191 L1526 181 L1559 180 L1606 180 L1647 187 L1688 188 L1725 183 L1757 190 L1790 181 L1830 187 L1876 193 L1919 186 L1963 192 L2001 184 L2039 178 L2070 179 L2105 180 L2141 187 L2186 176 L2224 189 L2265 176 L2302 194 L2338 189 L2371 178 L2410 191 L2450 176 L2489 183 L2532 177 L2572 187 L2609 179 L2648 191 L2693 176 L2729 178 L2766 181 L2797 191 L2841 185 L2881 193 L2912 184 L2952 191 L2988 178 L3030 193 L3065 183 L3105 189 L3137 191 L3172 189 L3203 184 L3243 191 L3282 180 L3322 179 L3368 191 L3403 185 L3442 183 L3475 181 L3512 181 L3544 181 L3581 193 L3600 196 Z"/>
  </g>
  <!-- the ground plane is black; the grid draws over it -->
  <rect id="ground" x="-2700" y="196" width="6300" height="1604" fill="#000"/>

  <!-- grid rays from the vanishing point (450,196) to the scenery edge. The eight inner rays are
       the core's (direction dx per 134 of dy: -590 -390 -202 -70 70 202 390 590); the two outer
       ones (dx 1000) only ever show on very wide windows. -->
  <g id="horizon" opacity="0.7">
    <!-- the rule draws out from the vanishing point to both scenery edges (3150 units each way) -->
    <g id="hrule" stroke="url(#ruleg)" stroke-width="1.6">
      <line class="anim" x1="450" y1="196" x2="-2700" y2="196"/><line class="anim" x1="450" y1="196" x2="3600" y2="196"/>
    </g>
    <g id="hlines" stroke="url(#gridg)" stroke-width="1.1" fill="none">
      <line class="anim" x1="450" y1="196" x2="-2700" y2="618"/><line class="anim" x1="450" y1="196" x2="-2700" y2="911"/>
      <line class="anim" x1="450" y1="196" x2="-2700" y2="1278"/><line class="anim" x1="450" y1="196" x2="-1968" y2="1800"/>
      <line class="anim" x1="450" y1="196" x2="-388" y2="1800"/><line class="anim" x1="450" y1="196" x2="1288" y2="1800"/>

<script src="lib/intro-helpers.js"></script>
<script>
/* ============================ NIGHT SKY ============================ */
// The star field is drawn into #stars before anything plays: one <path> of round-capped dots per
// brightness/tint step (see IntroHelpers.starField). ?stars=N and ?starsize=S override the defaults
// for tuning; without the helpers (file opened on its own, lib missing) the sky simply has no stars.
(function drawStars() {
  const H = window.IntroHelpers, g = document.getElementById('stars');
  if (!H || !H.starField || !g) return;
  const q = new URLSearchParams(location.search);
  const opts = {};
  if (q.get('stars') !== null) opts.count = parseInt(q.get('stars'), 10);
  if (q.get('starsize') !== null) opts.size = parseFloat(q.get('starsize'));
  if (q.get('starwash') !== null) { const [from, to] = q.get('starwash').split(',').map(parseFloat); opts.wash = {from, to}; }
  const field = H.starField(opts);
  const ns = 'http://www.w3.org/2000/svg';
  for (const grp of field.groups) {
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', grp.d); p.setAttribute('stroke', grp.fill); p.setAttribute('stroke-width', String(grp.r * 2));
    p.setAttribute('opacity', String(grp.a)); p.setAttribute('fill', 'none');
    g.appendChild(p);
  }
  g.dataset.count = String(field.stars.length);
})();

/* ============================ AUDIO CORE ============================ */
const N = n => 440 * Math.pow(2, (n - 69) / 12);          // MIDI note -> Hz
let ctx, mainOut;

function impulse(seconds, decay) {                         // synthetic plate/hall IR
  const len = Math.ceil(ctx.sampleRate * seconds), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return buf;
}

// Cosmos bus: dry + a long convolver send, gentle limiter on the sum
function buildOutput() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  mainOut = ctx.createGain(); mainOut.gain.value = 0.55;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 18; comp.ratio.value = 4; comp.attack.value = .005; comp.release.value = .25;
  const cv = ctx.createConvolver(); cv.buffer = impulse(5.5, 2.2);
  const wet = ctx.createGain(); wet.gain.value = .55;
  mainOut.connect(comp); mainOut.connect(cv); cv.connect(wet); wet.connect(comp); comp.connect(ctx.destination);
}

// noise: color 'white' | 'pink' (Kellet 3-pole approximation) | 'brown'
function noise(t0, dur, {gain = .1, lp = 4000, hp = 200, attack = .01, release = .1, color = 'white'} = {}) {
  const len = Math.ceil(ctx.sampleRate * dur), buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let b0 = 0, b1 = 0, b2 = 0, br = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (color === 'pink') { b0 = .99765 * b0 + w * .0990460; b1 = .96300 * b1 + w * .2965164; b2 = .57000 * b2 + w * 1.0526913; d[i] = (b0 + b1 + b2 + w * .1848) * .18; }
    else if (color === 'brown') { br = (br + .02 * w) / 1.02; d[i] = br * 3.5; }
    else d[i] = w;
  }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const f1 = ctx.createBiquadFilter(); f1.type = 'lowpass'; f1.frequency.value = lp;
  const f2 = ctx.createBiquadFilter(); f2.type = 'highpass'; f2.frequency.value = hp;
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + attack);
  g.gain.setValueAtTime(gain, t0 + dur - release); g.gain.linearRampToValueAtTime(0, t0 + dur);
  src.connect(f1); f1.connect(f2); f2.connect(g); g.connect(mainOut); src.start(t0); src.stop(t0 + dur);
  return {src, f1, g};
}

/* ============================ INSTRUMENTS ============================ */
// FM glass bell: sine carrier, ratio'd modulator with decaying index. The "tinkle".
function bell(t0, midi, vel = .2, dur = 1.4, ratio = 3.5) {
  const c = ctx.createOscillator(); c.type = 'sine'; c.frequency.value = N(midi);
  const m = ctx.createOscillator(); m.type = 'sine'; m.frequency.value = N(midi) * ratio;
  const mg = ctx.createGain(); mg.gain.setValueAtTime(N(midi) * 2.2, t0); mg.gain.exponentialRampToValueAtTime(1, t0 + dur * .7);
  m.connect(mg); mg.connect(c.frequency);
  const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vel, t0 + .004); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  c.connect(g); g.connect(mainOut); c.start(t0); m.start(t0); c.stop(t0 + dur + .02); m.stop(t0 + dur + .02);
}

// pad: sine + triangle, chorus-detuned x3, very slow attack, gentle filter sweep
function pad(t0, midi, dur, vel = .12, {attack = .9, release = 1.6} = {}) {
  const out = ctx.createGain(); out.gain.setValueAtTime(0, t0); out.gain.linearRampToValueAtTime(vel, t0 + attack);
  out.gain.setValueAtTime(vel, t0 + Math.max(attack, dur - release)); out.gain.linearRampToValueAtTime(0, t0 + dur);
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = .8;
  f.frequency.setValueAtTime(600, t0); f.frequency.linearRampToValueAtTime(2400, t0 + dur * .6); f.frequency.linearRampToValueAtTime(900, t0 + dur);
  [['sine', -6], ['triangle', 0], ['sine', 7]].forEach(([type, det]) => {
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = N(midi); o.detune.value = det;
    const og = ctx.createGain(); og.gain.value = .4; o.connect(og); og.connect(f); o.start(t0); o.stop(t0 + dur + .05);
  });
  f.connect(out); out.connect(mainOut);
}

// the sparkle burst, 1.52..2.4s: a scatter of bright pentatonic bells, high and short
const SPARK_T = [1.52, 1.71, 1.90, 2.09, 2.28, 2.47, 2.66, 2.85];   // = sparkle delays, 0.19s grid, one per corner
// notes: an array walked in order, or a function(i) -> midi.
function tinkle(t0, voice, vel, notes) {
  SPARK_T.forEach((t, i) => {
    const m = typeof notes === 'function' ? notes(i) : notes[i % notes.length];
    if (m != null) voice(t0 + t, m, vel, .9);
  });
}
// cosmos glint: pure sine, soft attack, long tail, faint octave -- a harmonic lighting up, not a bell
function glint(t0, midi, vel = .08, dur = 2.6) {
  [[0, 1], [12, .35]].forEach(([off, g]) => {
    const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = N(midi + off);
    const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = N(midi + off); o2.detune.value = 6;
    const e = ctx.createGain(); e.gain.setValueAtTime(0, t0); e.gain.linearRampToValueAtTime(vel * g, t0 + .14); e.gain.exponentialRampToValueAtTime(.001, t0 + dur);
    o.connect(e); o2.connect(e); e.connect(mainOut); o.start(t0); o2.start(t0); o.stop(t0 + dur + .02); o2.stop(t0 + dur + .02);
  });
}

/* ============================ SCORE ============================ */
// Cue times still follow the picture's beats (fly-in, sparkles, VU fill, the word at 2.70, the
// wide chord at 3.90). The word now lands whole at 2.70; the chords under it keep moving.
function scoreCosmos(t0) {
  // the void: sub drone and a slow pad on C-G, breathing
  pad(t0, 36, 7.4, .16, {attack: 1.2, release: 2.0}); pad(t0 + .1, 43, 7.3, .08, {attack: 1.6, release: 2.0});
  noise(t0, 7.4, {gain: .035, lp: 900, hp: 60, attack: 1.5, release: 1.5, color: 'brown'});   // deep-space wind
  // 0.8 fly-in: an ascending shimmer of bells, accelerating, like light bending in
  for (let i = 0; i < 14; i++) bell(t0 + .8 + Math.pow(i / 14, 1.6) * .75, 72 + [0, 2, 4, 7, 9][i % 5] + Math.floor(i / 5) * 12, .06 + i * .006, 1.8, 2.0);
  // 1.52 sparkles: glass bells, longer, with fifths underneath
  tinkle(t0, (t, m, v) => glint(t, m, v, 2.8), .07, [79, 81, 83, 86, 88, 91, 93, 95, 98, 100, 102, 105]);
  // 1.8 VU: soft pings on a Lydian scale
  [60, 64, 66, 67, 71, 74, 78].forEach((m, i) => bell(t0 + 1.80 + i * .13, m + 12, .09, 1.6, 2.0));
  // 2.7 the word: pad chords move underneath -- Cmaj9 -> Fmaj7#11 -> Gadd9 -> C Lydian, each blooming
  const P = (t, chord, d, v = .07) => chord.forEach((m, i) => pad(t0 + t, m, d, v * (i === 0 ? 1.3 : 1), {attack: .25, release: .5}));
  P(2.70, [48, 55, 62, 64, 71], 1.0); P(3.18, [41, 53, 60, 64, 71], 1.0); P(3.54, [43, 55, 59, 62, 69], .9);
  // 3.9 the wide chord: C Lydian, four octaves of pad, one bright bell far above
  [36, 48, 55, 62, 66, 67, 71, 74, 79, 86].forEach((m, i) => pad(t0 + 3.90, m, 3.4, i < 2 ? .13 : .06, {attack: .35 + i * .04, release: 1.8}));
  bell(t0 + 3.95, 98, .16, 3.4, 2.0); bell(t0 + 4.35, 103, .09, 3.0, 3.5);
  // 4.45 barely-there high pings under the hold
  for (let i = 0; i < 17; i++) bell(t0 + 4.45 + i * (1.15 / 17), 108 - (i % 3) * 5, .025, .5, 7);
  // a last, very slow descending bell trail into the hold (decays past 7 s: Chrome's engagement mark)
  [96, 91, 86, 79].forEach((m, i) => bell(t0 + 5.3 + i * .45, m, .07 - i * .012, 2.6, 2.0));
}

/* ============================ CONTROL (standalone) ============================ */
const stage = document.getElementById('stage'), ui = document.getElementById('ui');
function play() {
  stage.classList.remove('play'); void stage.offsetWidth;   // restart all keyframes
  if (!ctx || ctx.state === 'closed') buildOutput();
  scoreCosmos(ctx.currentTime + 0.08);
  setTimeout(() => stage.classList.add('play'), 80);
}
document.getElementById('start').onclick = () => { ui.classList.add('hidden'); play(); };
document.getElementById('replay').onclick = () => { if (ctx) { ctx.close(); ctx = null; } play(); };

// DEBUG: ?t=SECONDS freezes every animation at that time; ?run=1 schedules the score headless.
const q = new URLSearchParams(location.search);
if (q.get('run')) { ui.classList.add('hidden'); try { play(); console.log('scheduled cosmos'); } catch (e) { console.error('SCORE ERROR', e); } }
if (q.get('t') !== null) {
  ui.classList.add('hidden'); stage.classList.add('play');
  requestAnimationFrame(() => document.getAnimations().forEach(a => { a.pause(); a.currentTime = parseFloat(q.get('t')) * 1000; }));
}

/* ============================ EMBED MODE (dashboard loading screen) ============================ */
const T = {
  embedDone: 5.8,                                          // the hold has run its course; the parent may release from here
};
if (q.get('embed') === '1' && !q.get('run') && q.get('t') === null) (function embed() {
  const MSG = 'conductress-intro';
  const H = window.IntroHelpers;                           // shared pure rules (lib/intro-helpers.js); missing => silent run
  const parentWin = window.parent && window.parent !== window ? window.parent : null;
  const post = msg => { if (parentWin) parentWin.postMessage(Object.assign({type: MSG}, msg), '*'); };
  const opts = H ? H.parseEmbedQuery(location.search) : {sound: 'off'};
  const tailS = H ? H.AUDIO_TAIL_S : 9.6;
  const body = document.body;
  body.classList.add('embed');
  let audioOn = false, done = false, visualStart = 0;

  // The browser decides whether audio may start without a gesture. Firefox answers through
  // navigator.getAutoplayPolicy; elsewhere a resume() probe races a 250 ms timer (Chrome and
  // Firefox park a refused context at 'suspended' on creation, Safari parks every new context
  // there until resume()). The visuals wait for the answer: the opening frame is black anyway.
  function probeAutoplay() {
    try { if (!ctx || ctx.state === 'closed') buildOutput(); } catch (e) { return Promise.resolve(false); }
    try {
      if (typeof navigator.getAutoplayPolicy === 'function' && navigator.getAutoplayPolicy('audiocontext') === 'disallowed') return Promise.resolve(false);
    } catch (e) { /* policy API absent or unhappy: fall through to the probe */ }
    if (ctx.state === 'running') return Promise.resolve(true);
    return new Promise(resolve => {
      let settled = false;
      const finish = () => { if (settled) return; settled = true; resolve(ctx.state === 'running'); };
      try { ctx.resume().then(finish, finish); } catch (e) { finish(); }
      setTimeout(finish, 250);
    });
  }

  // Schedule the score from a fresh timeline zero 80 ms ahead, exactly as PRESS START does.
  // A late join is not possible: a refused AudioContext sits at currentTime 0 until the gesture
  // resumes it, so "timeline zero N seconds ago" is a negative time and WebAudio rejects it.
  function scheduleAudio() {
    if (!ctx || ctx.state === 'closed') buildOutput();
    const t0 = ctx.currentTime + 0.08;
    scoreCosmos(t0);
    audioOn = true; body.classList.add('audio');
    post({event: 'audio'});
    // The score keeps its tail audible past 7 s (Chrome's media-engagement threshold); tell the
    // parent when it is over so a frame kept alive for the tail can go.
    const endAt = t0 + tailS;
    (function tick() {
      if (!ctx || ctx.state === 'closed') return;
      if (ctx.currentTime >= endAt) { try { ctx.close(); } catch (e) { /* already closed */ } post({event: 'audio-ended'}); return; }
      setTimeout(tick, 200);
    })();
  }
  // 'done' is clock-locked to the visuals (the moment .play was applied), not to setTimeout drift
  function armDone() {
    done = false;
    (function tick() { if (done) return; if (visualStart && (performance.now() - visualStart) / 1000 >= T.embedDone) { done = true; post({event: 'done'}); return; } requestAnimationFrame(tick); })();
  }
  function begin() { stage.classList.add('play'); visualStart = performance.now(); }
  function start(withAudio) {
    stage.classList.remove('play'); void stage.offsetWidth;   // restart all keyframes
    armDone();
    if (withAudio) { scheduleAudio(); setTimeout(begin, 80); } else begin();
  }

  if (H && H.wantsAudio(opts.sound)) {
    probeAutoplay().then(allowed => {
      const d = H.soundDecision(opts.sound, allowed);
      console.info('[conductress-intro] autoplay ' + (allowed ? 'allowed' : 'refused') + ' by the browser; sound=' + opts.sound + (d.start ? ': playing with sound' : d.offer ? ': SOUND button offered' : ': running silent'));
      post({event: 'autoplay', allowed, mode: opts.sound});
      if (d.offer) body.classList.add('offersound');
      start(d.start);                                           // allowed: play with sound; else visuals only
    });
  } else {
    post({event: 'autoplay', allowed: false, mode: 'off'});
    start(false);
  }

  document.getElementById('soundhint').onclick = e => {
    e.stopPropagation();
    if (audioOn) return;
    const go = () => { post({event: 'restart'}); start(true); };
    if (ctx && ctx.state === 'suspended') ctx.resume().then(go, go); else go();
  };
  // anywhere else: skip. The parent owns the transition; we just ask.
  stage.addEventListener('click', () => post({event: 'skip'}));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') post({event: 'skip'}); });

  window.addEventListener('message', e => {
    if (parentWin && e.source !== parentWin) return;
    const m = e.data;
    if (!m || m.type !== MSG) return;
    if (m.cmd === 'release') {
      body.classList.add('released');
      if (m.keepAudio || !ctx || !mainOut) return;            // the score finishes under the dashboard
      const ms = Math.max(0, +m.ms || 0), now = ctx.currentTime;
      mainOut.gain.cancelScheduledValues(now); mainOut.gain.setValueAtTime(mainOut.gain.value, now); mainOut.gain.linearRampToValueAtTime(0, now + ms / 1000);
    }
  });

  post({event: 'ready'});
})();
</script>
</body>
</html>
