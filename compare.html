<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valkey vs Redis — Engine Comparison</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --text: #e2e8f0; --card: #1a1d2e; --border: #2d3148;
      --accent: #6366f1; --muted: #64748b; --ok: #22c55e; --warn: #eab308; --danger: #ef4444;
      --valkey: #6366f1; --redis: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; }
    header { position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 0.75rem 1.5rem; margin: -1.5rem -1.5rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
    h1 { font-size: 1.1rem; margin: 0; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; color: var(--text); }
    a { color: var(--muted); text-decoration: none; font-size: 0.8rem; }
    a:hover { color: var(--text); }

    .platform-tabs { display: flex; gap: 0.3rem; }
    .platform-tab { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 0.35rem 0.8rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
    .platform-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

    .comparison-mode { display: flex; gap: 0.3rem; margin-left: auto; }
    .mode-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 0.35rem 0.8rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; }
    .mode-btn.active { background: var(--border); color: var(--text); }

    .section { margin-bottom: 2rem; }
    .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 1rem; }
    .chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .chart-card canvas { width: 100%; }
    .chart-card { height: 280px; overflow: hidden; }
    .chart-card h3 { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.5rem; }

    .legend { display: flex; gap: 1.5rem; align-items: center; margin: 0.75rem 0; font-size: 0.8rem; }
    .legend-item { display: flex; align-items: center; gap: 0.4rem; }
    .legend-swatch { width: 12px; height: 12px; border-radius: 2px; }

    .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.5rem; margin-bottom: 1rem; }
    .summary-header { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 1fr 1.5fr; gap: 0.5rem; padding: 0.4rem 0; border-bottom: 2px solid var(--border); font-size: 0.75rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; }
    .summary-row { display: grid; grid-template-columns: 2fr 1.2fr 1.2fr 1fr 1.5fr; gap: 0.5rem; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    .summary-row:last-child { border-bottom: none; }
    .summary-label { color: var(--text); font-weight: 500; }
    .summary-val { font-weight: 600; text-align: right; }
    .summary-num { color: var(--text); font-variant-numeric: tabular-nums; }
    .summary-val.positive { color: var(--ok); }
    .summary-val.negative { color: var(--danger); }
    .summary-val.neutral { color: var(--muted); }

    .note { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; font-style: italic; }
    .loading { color: var(--muted); font-size: 0.85rem; padding: 2rem; text-align: center; }
    .badge { font-size: 0.7rem; padding: 1px 6px; border-radius: 3px; margin-left: 0.5rem; }
    .badge-head { background: var(--warn); color: #000; }
    .badge-release { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>Valkey vs Redis — Engine Comparison</h1>
    <div class="platform-tabs" id="platformTabs"></div>
    <div class="comparison-mode">
      <button class="mode-btn active" onclick="setMode('release')" id="mode-release">At Releases</button>
      <button class="mode-btn" onclick="setMode('head')" id="mode-head">Current HEAD</button>
    </div>
    <a href="index.html">← Performance History</a>
  </header>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--valkey)"></div> Valkey</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--redis)"></div> Redis</div>
  </div>

  <div id="content"><div class="loading">Loading comparison data...</div></div>

  <script src="config.js"></script>
  <script>
    let COMPARE_WORKLOADS = THROUGHPUT_WORKLOADS.filter(w => !w.platforms); // cross-platform only
    const COMPARE_MEMORY = MEMORY_WORKLOADS;

    function workloadLabel(id) {
      const raw = id.replace(/^memory-/, '');
      const parts = raw.split('-');
      const cmd = parts[0].toUpperCase();
      const specs = parts.slice(1).map(p => {
        if (p.startsWith('k')) return `K=${p.slice(1)}B`;
        if (p.startsWith('v')) return `V=${p.slice(1)}B`;
        if (p.startsWith('t')) return `T=${p.slice(1)}`;
        if (p.startsWith('p')) return `P=${p.slice(1)}`;
        if (p.startsWith('m')) return `M=${p.slice(1)}B`;
        if (p.startsWith('f')) return `F=${p.slice(1)}`;
        if (p === 'expire') return '+expire';
        return p;
      });
      return `${cmd} ${specs.join(' ')}`;
    }

    let activePlatform = PLATFORMS[0];
    let mode = 'release'; // 'release' or 'head'
    let cache = {};

    // --- Data fetching ---
    async function fetchSeries(engine, platform, workloadId, type) {
      const prefix = engine === 'valkey' ? '' : `${engine}-`;
      let fileId;
      if (type === 'memory') {
        fileId = engine === 'valkey' ? workloadId : workloadId.replace('memory-', `memory-${engine}-`);
      } else {
        fileId = `${prefix}${workloadId}`;
      }
      const key = `${platform}-${fileId}-${type}`;
      if (cache[key]) return cache[key];
      try {
        const r = await fetch(`${DATA_URL}/series-${platform}-${fileId}-${type}.json`);
        if (!r.ok) return null;
        cache[key] = await r.json();
        return cache[key];
      } catch { return null; }
    }

    // --- Extract comparison data ---
    function getReleasesFromLandmarks(data) {
      if (!data || !data.landmarks) return [];
      return data.landmarks
        .filter(l => /^\d+\./.test(l.label))
        .sort((a, b) => a.commit_index - b.commit_index);
    }

    function getValueAtCommitIndex(data, commitIndex, workloadId) {
      if (!data || !data.points) return null;
      // Find closest point to this commit_index
      let best = null, bestDist = Infinity;
      for (const p of data.points) {
        const dist = Math.abs(p.commit_index - commitIndex);
        if (dist < bestDist) {
          bestDist = dist;
          best = p;
        }
      }
      if (!best || !best.results) return null;
      // Try exact workload key or with engine prefix variants
      const result = best.results[workloadId]
        || best.results[`redis-${workloadId}`]
        || best.results[workloadId.replace('memory-', 'memory-redis-')];
      if (!result) return null;
      const value = best.breakdown ? Object.values(best.breakdown).reduce((s,v)=>s+v,0) : result.rps + (MEMORY_USER_DATA[workloadId] || 0);
      return { value, cv: result.cv, reps: result.reps || 3, date: best.date, commit: best.commit, breakdown: best.breakdown };
    }

    function getLatestValue(data, workloadId) {
      if (!data || !data.points || data.points.length === 0) return null;
      // Use last 5 points: median value, pooled CV, total reps
      const recent = data.points.slice(-5);
      const entries = recent.map(p => {
        const r = p.results[workloadId] || p.results[`redis-${workloadId}`] || p.results[workloadId.replace('memory-', 'memory-redis-')];
        if (!r) return null;
        const val = p.breakdown ? Object.values(p.breakdown).reduce((s,v)=>s+v,0) : r.rps + (MEMORY_USER_DATA[workloadId] || 0);
        return { rps: val, cv: r.cv, reps: r.reps || 3 };
      }).filter(v => v !== null);
      if (entries.length === 0) return null;
      const values = entries.map(e => e.rps).sort((a, b) => a - b);
      const median = values[Math.floor(values.length / 2)];
      const totalReps = entries.reduce((s, e) => s + e.reps, 0);
      // Pooled CV: RMS of individual CVs
      const pooledCv = Math.sqrt(entries.reduce((s, e) => s + e.cv * e.cv, 0) / entries.length);
      const last = recent[recent.length - 1];
      return { value: median, cv: pooledCv, reps: totalReps, n: entries.length, date: last.date, commit: last.commit, breakdown: last.breakdown };
    }

    // --- Rendering ---
    function renderPlatformTabs() {
      const el = document.getElementById('platformTabs');
      el.innerHTML = PLATFORMS.map(p =>
        `<button class="platform-tab ${p === activePlatform ? 'active' : ''}" onclick="setPlatform('${p}')">${PLATFORM_LABELS[p]}</button>`
      ).join('');
    }

    function setPlatform(p) { activePlatform = p; renderPlatformTabs(); render(); }
    function setMode(m) {
      mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`mode-${m}`).classList.add('active');
      render();
    }

    async function render() {
      const content = document.getElementById('content');
      content.innerHTML = '<div class="loading">Loading...</div>';

      // Fetch all data for current platform
      const throughputData = {};
      const memoryData = {};
      for (const engine of ['valkey', 'redis']) {
        throughputData[engine] = {};
        for (const w of COMPARE_WORKLOADS) {
          throughputData[engine][w.id] = await fetchSeries(engine, activePlatform, w.id, 'throughput');
        }
        memoryData[engine] = {};
        for (const w of COMPARE_MEMORY) {
          memoryData[engine][w] = await fetchSeries(engine, activePlatform, w, 'memory');
        }
      }

      let html = '';

      if (mode === 'release') {
        html += renderReleaseComparison(throughputData, memoryData);
      } else {
        html += renderHeadComparison(throughputData, memoryData);
      }

      content.innerHTML = html;
      // Render charts after DOM is ready
      requestAnimationFrame(() => renderCharts(throughputData, memoryData));
    }

    function renderReleaseComparison(throughputData, memoryData) {
      // Find the latest release for each engine
      const valkeyReleases = getReleasesFromLandmarks(Object.values(throughputData.valkey).find(d => d));
      const redisReleases = getReleasesFromLandmarks(Object.values(throughputData.redis).find(d => d));

      const latestValkey = valkeyReleases[valkeyReleases.length - 1];
      const latestRedis = redisReleases[redisReleases.length - 1];

      if (!latestValkey || !latestRedis) {
        return '<div class="loading">Insufficient release data for comparison.</div>';
      }

      let html = `<div class="summary-card">
        <div class="summary-row"><span class="summary-label">Comparing</span>
          <span>Valkey <strong>${latestValkey.label}</strong> <span class="badge badge-release">${latestValkey.date}</span>
          vs Redis <strong>${latestRedis.label}</strong> <span class="badge badge-release">${latestRedis.date}</span></span></div>
      </div>`;

      html += '<div class="section"><h2>Throughput (requests/sec)</h2>';
      html += '<div class="chart-grid">';
      html += `<div class="chart-card"><h3>Throughput by Workload</h3><canvas id="throughput-bars"></canvas></div>`;
      html += '</div>';
      html += renderThroughputTable(throughputData, latestValkey, latestRedis);
      html += '</div>';

      html += '<div class="section"><h2>Memory (bytes/key, total allocation)</h2>';
      html += '<div class="chart-grid">';
      html += `<div class="chart-card"><h3>Memory by Workload</h3><canvas id="memory-bars"></canvas></div>`;
      html += '</div>';
      html += renderMemoryTable(memoryData, latestValkey, latestRedis);
      html += '</div>';

      return html;
    }

    function renderHeadComparison(throughputData, memoryData) {
      let html = `<div class="summary-card">
        <div class="summary-row"><span class="summary-label">Comparing</span>
          <span>Valkey <strong>HEAD</strong> <span class="badge badge-head">unstable</span>
          vs Redis <strong>HEAD</strong> <span class="badge badge-head">unstable</span>
          — median of last 5 data points</span></div>
      </div>`;

      html += '<div class="section"><h2>Throughput (requests/sec)</h2>';
      html += '<div class="chart-grid">';
      html += `<div class="chart-card"><h3>Throughput by Workload</h3><canvas id="throughput-bars"></canvas></div>`;
      html += '</div>';
      html += renderThroughputTableHead(throughputData);
      html += '</div>';

      html += '<div class="section"><h2>Memory (bytes/key, total allocation)</h2>';
      html += '<div class="chart-grid">';
      html += `<div class="chart-card"><h3>Memory by Workload</h3><canvas id="memory-bars"></canvas></div>`;
      html += '</div>';
      html += renderMemoryTableHead(memoryData);
      html += '</div>';

      return html;
    }

    function renderThroughputTable(data, vRelease, rRelease) {
      let rows = '<div class="summary-header"><span>Workload</span><span>Valkey</span><span>Redis</span><span>Δ</span><span>Verdict</span></div>';
      for (const w of COMPARE_WORKLOADS) {
        const v = getValueAtCommitIndex(data.valkey[w.id], vRelease.commit_index, w.id);
        const r = getValueAtCommitIndex(data.redis[w.id], rRelease.commit_index, w.id);
        if (!v || !r) { rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w.id)}</span><span>—</span><span>—</span><span>—</span><span class="summary-val neutral">—</span></div>`; continue; }
        const pct = ((v.value - r.value) / r.value * 100);
        const p = welchPValue(v.value, v.cv, v.reps, r.value, r.cv, r.reps);
        const sig = p !== null && p < 0.05;
        const cls = sig ? (pct > 0 ? 'positive' : 'negative') : 'neutral';
        const verdict = sig ? (pct > 0 ? `${pct.toFixed(1)}% faster` : `${Math.abs(pct).toFixed(1)}% slower`) : 'Not significant';
        const delta = fmtRps(Math.abs(v.value - r.value));
        rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w.id)}</span><span class="summary-num">${fmtRps(v.value)}</span><span class="summary-num">${fmtRps(r.value)}</span><span class="summary-num ${cls}">${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</span><span class="summary-val ${cls}">${verdict} ${pValueLabel(p)}</span></div>`;
      }
      return `<div class="summary-card">${rows}</div>`;
    }

    function renderThroughputTableHead(data) {
      let rows = '<div class="summary-header"><span>Workload</span><span>Valkey</span><span>Redis</span><span>Δ</span><span>Verdict</span></div>';
      for (const w of COMPARE_WORKLOADS) {
        const v = getLatestValue(data.valkey[w.id], w.id);
        const r = getLatestValue(data.redis[w.id], w.id);
        if (!v || !r) { rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w.id)}</span><span>—</span><span>—</span><span>—</span><span class="summary-val neutral">— (insufficient data)</span></div>`; continue; }
        const pct = ((v.value - r.value) / r.value * 100);
        const p = welchPValue(v.value, v.cv, v.reps, r.value, r.cv, r.reps);
        const sig = p !== null && p < 0.05;
        const cls = sig ? (pct > 0 ? 'positive' : 'negative') : 'neutral';
        const verdict = sig ? (pct > 0 ? `${pct.toFixed(1)}% faster` : `${Math.abs(pct).toFixed(1)}% slower`) : 'Not significant';
        rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w.id)}</span><span class="summary-num">${fmtRps(v.value)}</span><span class="summary-num">${fmtRps(r.value)}</span><span class="summary-num ${cls}">${pct > 0 ? '+' : ''}${pct.toFixed(1)}%</span><span class="summary-val ${cls}">${verdict} ${pValueLabel(p)}</span></div>`;
      }
      return `<div class="summary-card">${rows}</div>`;
    }

    function renderMemoryTable(data, vRelease, rRelease) {
      let rows = '<div class="summary-header"><span>Workload</span><span>Valkey</span><span>Redis</span><span>Δ</span><span>Verdict</span></div>';
      for (const w of COMPARE_MEMORY) {
        const v = getValueAtCommitIndex(data.valkey[w], vRelease.commit_index, w);
        const r = getValueAtCommitIndex(data.redis[w], rRelease.commit_index, w);
        if (!v || !r) { rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w)}</span><span>—</span><span>—</span><span>—</span><span class="summary-val neutral">—</span></div>`; continue; }
        const pct = ((v.value - r.value) / r.value * 100);
        const cls = pct < -1 ? 'positive' : pct > 1 ? 'negative' : 'neutral';
        const verdict = pct < -1 ? `${Math.abs(pct).toFixed(1)}% less` : pct > 1 ? `${pct.toFixed(1)}% more` : 'Equal';
        const diff = (v.value - r.value).toFixed(1);
        rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w)}</span><span class="summary-num">${v.value.toFixed(1)} B</span><span class="summary-num">${r.value.toFixed(1)} B</span><span class="summary-num ${cls}">${diff > 0 ? '+' : ''}${diff} B</span><span class="summary-val ${cls}">${verdict}</span></div>`;
      }
      return `<div class="summary-card">${rows}</div>`;
    }

    function renderMemoryTableHead(data) {
      let rows = '<div class="summary-header"><span>Workload</span><span>Valkey</span><span>Redis</span><span>Δ</span><span>Verdict</span></div>';
      for (const w of COMPARE_MEMORY) {
        const v = getLatestValue(data.valkey[w], w);
        const r = getLatestValue(data.redis[w], w);
        if (!v || !r) { rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w)}</span><span>—</span><span>—</span><span>—</span><span class="summary-val neutral">— (insufficient data)</span></div>`; continue; }
        const pct = ((v.value - r.value) / r.value * 100);
        const cls = pct < -1 ? 'positive' : pct > 1 ? 'negative' : 'neutral';
        const verdict = pct < -1 ? `${Math.abs(pct).toFixed(1)}% less` : pct > 1 ? `${pct.toFixed(1)}% more` : 'Equal';
        const diff = (v.value - r.value).toFixed(1);
        rows += `<div class="summary-row"><span class="summary-label">${workloadLabel(w)}</span><span class="summary-num">${v.value.toFixed(1)} B</span><span class="summary-num">${r.value.toFixed(1)} B</span><span class="summary-num ${cls}">${diff > 0 ? '+' : ''}${diff} B</span><span class="summary-val ${cls}">${verdict}</span></div>`;
      }
      return `<div class="summary-card">${rows}</div>`;
    }

    // --- Stats helpers ---
    function ci95(value, cv, reps) {
      // CI95 half-width from CV% and sample size (t ≈ 2 for small n)
      if (!cv || !reps || reps < 2) return 0;
      const se = (cv / 100) * value / Math.sqrt(reps);
      return 1.96 * se;
    }

    function welchPValue(v1, cv1, n1, v2, cv2, n2) {
      // Approximate Welch's t-test p-value from means, CVs, and sample sizes
      if (!cv1 || !cv2 || n1 < 2 || n2 < 2) return null;
      const s1 = (cv1 / 100) * v1; // std dev
      const s2 = (cv2 / 100) * v2;
      const se = Math.sqrt((s1 * s1) / n1 + (s2 * s2) / n2);
      if (se === 0) return 0; // identical measurements
      const t = Math.abs(v1 - v2) / se;
      // Welch-Satterthwaite df
      const a = (s1 * s1) / n1, b = (s2 * s2) / n2;
      const df = ((a + b) ** 2) / (a * a / (n1 - 1) + b * b / (n2 - 1));
      // Approximate p-value from t and df using regularized incomplete beta
      return tDistPValue(t, df);
    }

    function tDistPValue(t, df) {
      // Two-tailed p-value approximation using normal for large df, otherwise beta approx
      if (df > 100) {
        // Normal approximation
        const z = t;
        return 2 * (1 - normalCDF(z));
      }
      // Approximation via: p ≈ 2 * (1 - normalCDF(t * (1 - 1/(4*df))))
      const adj = t * (1 - 1 / (4 * df));
      return 2 * (1 - normalCDF(adj));
    }

    function normalCDF(x) {
      // Abramowitz & Stegun approximation
      if (x < 0) return 1 - normalCDF(-x);
      const t = 1 / (1 + 0.2316419 * x);
      const d = 0.3989422804014327; // 1/sqrt(2*pi)
      const p = d * Math.exp(-x * x / 2) * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
      return 1 - p;
    }

    function pValueLabel(p) {
      if (p === null) return '';
      if (p < 0.001) return '<span style="color:var(--ok);font-weight:600">p&lt;0.001</span>';
      if (p < 0.01) return `<span style="color:var(--ok)">p=${p.toFixed(3)}</span>`;
      if (p < 0.05) return `<span style="color:var(--warn)">p=${p.toFixed(3)}</span>`;
      return `<span style="color:var(--muted)">p=${p.toFixed(2)} (n.s.)</span>`;
    }

    function renderCharts(throughputData, memoryData) {
      renderBarChart('throughput-bars', throughputData, 'throughput');
      renderBarChart('memory-bars', memoryData, 'memory');
    }

    function renderBarChart(canvasId, data, type) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      const workloads = type === 'throughput' ? COMPARE_WORKLOADS : COMPARE_MEMORY;
      const labels = workloads.map(w => type === 'throughput' ? workloadLabel(w.id) : workloadLabel(w));
      const valkeyVals = [], redisVals = [], valkeyErr = [], redisErr = [];

      const valkeySource = Object.values(data.valkey).find(d => d);
      const redisSource = Object.values(data.redis).find(d => d);
      const vReleases = getReleasesFromLandmarks(valkeySource);
      const rReleases = getReleasesFromLandmarks(redisSource);
      const latestV = vReleases[vReleases.length - 1];
      const latestR = rReleases[rReleases.length - 1];

      for (const w of workloads) {
        const wId = type === 'throughput' ? w.id : w;
        let v, r;
        if (mode === 'release' && latestV && latestR) {
          v = getValueAtCommitIndex(data.valkey[wId], latestV.commit_index, wId);
          r = getValueAtCommitIndex(data.redis[wId], latestR.commit_index, wId);
        } else {
          v = getLatestValue(data.valkey[wId], wId);
          r = getLatestValue(data.redis[wId], wId);
        }
        valkeyVals.push(v ? v.value : null);
        redisVals.push(r ? r.value : null);
        valkeyErr.push(v ? ci95(v.value, v.cv, v.reps) : 0);
        redisErr.push(r ? ci95(r.value, r.cv, r.reps) : 0);
      }

      // Error bar plugin (draws CI95 whiskers)
      const errorBarPlugin = {
        id: 'errorBars',
        afterDatasetsDraw(chart) {
          const { ctx } = chart;
          chart.data.datasets.forEach((ds, dsIdx) => {
            // For memory stacked: only draw on overhead datasets (index 1=valkey, 3=redis)
            if (type === 'memory') {
              if (dsIdx !== 1 && dsIdx !== 3) return;
              const errs = dsIdx === 1 ? valkeyErr : redisErr;
              const totals = dsIdx === 1 ? valkeyVals : redisVals;
              const meta = chart.getDatasetMeta(dsIdx);
              meta.data.forEach((bar, i) => {
                const err = errs[i];
                if (!err || !totals[i]) return;
                const scale = chart.scales.x;
                const total = totals[i];
                const xMin = scale.getPixelForValue(total - err);
                const xMax = scale.getPixelForValue(total + err);
                const y = bar.y;
                ctx.save(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(xMin, y); ctx.lineTo(xMax, y);
                ctx.moveTo(xMin, y - 4); ctx.lineTo(xMin, y + 4);
                ctx.moveTo(xMax, y - 4); ctx.lineTo(xMax, y + 4);
                ctx.stroke(); ctx.restore();
              });
            } else {
              const meta = chart.getDatasetMeta(dsIdx);
              const errs = dsIdx === 0 ? valkeyErr : redisErr;
              meta.data.forEach((bar, i) => {
                const err = errs[i];
                if (!err || !ds.data[i]) return;
                const scale = chart.scales.x;
                const xMin = scale.getPixelForValue(ds.data[i] - err);
                const xMax = scale.getPixelForValue(ds.data[i] + err);
                const y = bar.y;
                ctx.save(); ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(xMin, y); ctx.lineTo(xMax, y);
                ctx.moveTo(xMin, y - 4); ctx.lineTo(xMin, y + 4);
                ctx.moveTo(xMax, y - 4); ctx.lineTo(xMax, y + 4);
                ctx.stroke(); ctx.restore();
              });
            }
          });
        }
      };

      // For memory charts, split into user data base + overhead
      let datasets;
      if (type === 'memory') {
        const userData = workloads.map(w => MEMORY_USER_DATA[w] || 0);
        const vOverhead = valkeyVals.map((v, i) => v !== null ? v - userData[i] : null);
        const rOverhead = redisVals.map((v, i) => v !== null ? v - userData[i] : null);
        datasets = [
          { label: 'User Data', data: userData, backgroundColor: 'rgba(100,116,139,0.35)', borderWidth: 0, stack: 'valkey' },
          { label: 'Valkey Overhead', data: vOverhead, backgroundColor: 'rgba(99,102,241,0.75)', borderColor: '#6366f1', borderWidth: 1, stack: 'valkey' },
          { label: 'User Data', data: userData, backgroundColor: 'rgba(100,116,139,0.35)', borderWidth: 0, stack: 'redis' },
          { label: 'Redis Overhead', data: rOverhead, backgroundColor: 'rgba(239,68,68,0.75)', borderColor: '#ef4444', borderWidth: 1, stack: 'redis' },
        ];
      } else {
        datasets = [
          { label: 'Valkey', data: valkeyVals, backgroundColor: 'rgba(99,102,241,0.75)', borderColor: '#6366f1', borderWidth: 1 },
          { label: 'Redis', data: redisVals, backgroundColor: 'rgba(239,68,68,0.75)', borderColor: '#ef4444', borderWidth: 1 },
        ];
      }

      new Chart(canvas, {
        type: 'bar',
        plugins: [errorBarPlugin],
        data: {
          labels,
          datasets
        },
        options: {
          indexAxis: 'y',
          responsive: true, maintainAspectRatio: false,
          datasets: { bar: { barPercentage: 0.9, categoryPercentage: 0.95 } },
          plugins: {
            legend: { labels: { color: '#e2e8f0', boxWidth: 12, filter: (item) => type === 'memory' ? !item.text.startsWith('User Data') || item.datasetIndex === 0 : true } },
            tooltip: { callbacks: { label: ctx => {
              if (type === 'memory' && ctx.dataset.label === 'User Data') return `User Data: ${ctx.raw.toFixed(1)} B/key`;
              if (type === 'memory') {
                const err = ctx.datasetIndex <= 1 ? valkeyErr[ctx.dataIndex] : redisErr[ctx.dataIndex];
                return ctx.raw !== null ? `${ctx.dataset.label.replace(' Overhead', '')}: ${ctx.raw.toFixed(1)} B overhead ±${err.toFixed(1)}` : 'No data';
              }
              return ctx.raw !== null ? `${ctx.dataset.label}: ${fmtRps(ctx.raw)} ±${fmtRps(ctx.datasetIndex === 0 ? valkeyErr[ctx.dataIndex] : redisErr[ctx.dataIndex])}` : 'No data';
            } } }
          },
          scales: {
            x: { stacked: type === 'memory', grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', callback: v => type === 'throughput' ? fmtRps(v) : v + ' B' },
              title: { display: true, text: type === 'throughput' ? 'Requests/sec' : 'Bytes/key (total)', color: '#64748b', font: { size: 11 } }
            },
            y: { stacked: type === 'memory', grid: { display: false }, ticks: { color: '#e2e8f0', font: { size: 11 } } }
          }
        }
      });
    }

    function fmtRps(v) {
      if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
      if (v >= 1e3) return (v / 1e3).toFixed(0) + 'K';
      return v.toFixed(0);
    }

    // --- Init ---
    (async () => {
      await discoverWorkloads();
      COMPARE_WORKLOADS = THROUGHPUT_WORKLOADS.filter(w => !w.platforms);
      renderPlatformTabs();
      render();
    })();
  </script>
</body>
</html>
