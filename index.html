<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valkey Performance Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --text: #e2e8f0; --card: #1a1d2e; --border: #2d3148;
      --accent: #6366f1; --muted: #64748b; --ok: #22c55e; --warn: #eab308; --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 1.5rem; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }

    /* Desktop: cap chart grids at 2 columns */
    @media (min-width: 850px) {
      #perfCharts, #memoryChartsGrid { grid-template-columns: repeat(2, 1fr) !important; }
    }

    /* Layout reservation: fixed heights prevent CLS */
    .chart-panel { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .chart-panel canvas { width: 100%; }
    .chart-panel--throughput { height: 320px; }
    .chart-panel--memory { height: 290px; }
    .chart-panel--perf { height: 200px; margin-bottom: 0.75rem; }

    /* Info row: always visible below its chart */
    .info-row {
      font-size: 0.78rem; color: var(--muted); padding: 0.35rem 1rem 0.5rem;
      display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
      min-height: 1.8em; line-height: 1.4;
      border-top: 1px solid var(--border);
      background: var(--card); border-radius: 0 0 8px 8px;
      margin-top: -1px; margin-bottom: 1.5rem; /* space before next section */
    }
    .info-row:empty::after { content: '\00a0'; } /* prevent collapse when empty */
    .info-row .info-val { color: var(--text); font-weight: 500; }
    .info-row .info-sep { color: var(--border); }

    /* Header */
    header { position: sticky; top: 0; z-index: 100; background: var(--bg); padding: 0.75rem 1.5rem; margin: -1.5rem -1.5rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
    .controls select, .controls button { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.85rem; cursor: pointer; }
    .zoom-btn { font-size: 0.8rem; padding: 3px 10px; cursor: pointer; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
    .zoom-btn:hover { background: var(--border); }

    /* Annotations */
    .annotations { display: grid; gap: 0.5rem; }
    .annotation { background: var(--card); border-radius: 6px; padding: 0.7rem 1rem; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    .annotation.bad { border-left: 3px solid var(--danger); }
    .annotation.good { border-left: 3px solid var(--ok); }
    .annotation .delta { font-weight: 600; white-space: nowrap; }
    .annotation .delta.neg { color: var(--danger); }
    .annotation .delta.pos { color: var(--ok); }
    .annotation .meta { color: var(--muted); font-size: 0.75rem; margin-top: 0.2rem; }
    .annotation a { color: var(--accent); text-decoration: none; }

    /* Help button */
    .help-btn { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--border); color: var(--muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; border: none; vertical-align: middle; margin-left: 0.4rem; transition: background 0.15s; }
    .help-btn:hover { background: var(--accent); color: var(--text); }

    /* Help modal */
    #helpModal { display: none; position: fixed; inset: 0; z-index: 1000; align-items: center; justify-content: center; }
    .help-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
    .help-content { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: 10px; max-width: 560px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 1.5rem; }
    .help-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    .help-title { font-size: 1rem; font-weight: 600; }
    .help-close { background: none; border: none; color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 0.2rem 0.5rem; }
    .help-close:hover { color: var(--text); }
    .help-body { font-size: 0.85rem; line-height: 1.6; color: var(--text); }
    .help-body p { margin-bottom: 0.6rem; }
    .help-body ul { margin: 0.4rem 0 0.8rem 1.2rem; }
    .help-body li { margin-bottom: 0.3rem; }
    .help-body code { background: var(--bg); padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.8rem; }

    /* Commit detail popup */
    #commitPopup { display: none; position: fixed; z-index: 900; max-width: 420px; width: 90%; }
    .cpop { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .cpop-close { position: absolute; top: 8px; right: 12px; background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1; }
    .cpop-close:hover { color: var(--text); }
    .cpop-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .cpop-hash { font-family: monospace; font-size: 13px; background: var(--bg); padding: 2px 8px; border-radius: 4px; color: var(--accent); text-decoration: none; }
    .cpop-hash:hover { text-decoration: underline; }
    .cpop-date { font-size: 12px; color: var(--muted); }
    .cpop-title { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; }
    .cpop-links { display: flex; gap: 12px; margin-bottom: 10px; }
    .cpop-links a { font-size: 12px; color: var(--accent); text-decoration: none; }
    .cpop-links a:hover { text-decoration: underline; }
    .cpop-sep { border: none; border-top: 1px solid var(--border); margin: 8px 0; }
    .cpop-rps { font-size: 22px; font-weight: 700; }
    .cpop-rps-unit { font-size: 12px; font-weight: 400; color: var(--muted); }
    .cpop-cv { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .cpop-delta { font-size: 13px; margin-top: 6px; font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .cpop-delta-sig-up { color: var(--ok); }
    .cpop-delta-sig-down { color: var(--danger); }
    .cpop-delta-noise { color: var(--muted); }
    .cpop-badge { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
    .cpop-badge-sig { background: rgba(34,197,94,0.15); color: var(--ok); }
    .cpop-badge-noise { background: rgba(148,163,184,0.15); color: var(--muted); }
    .cpop-badge-regress { background: rgba(239,68,68,0.15); color: var(--danger); }
    .cpop-perf { margin-top: 8px; }
    .cpop-perf-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .cpop-perf-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
    .cpop-perf-item { background: var(--bg); border-radius: 5px; padding: 5px 7px; }
    .cpop-perf-name { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.3px; }
    .cpop-perf-val { font-size: 13px; font-weight: 600; margin-top: 1px; }
    .cpop-perf-d { font-size: 10px; margin-top: 1px; }
    .cpop-footer { font-size: 11px; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 style="font-size:1.1rem;margin:0;">Valkey Unstable — Performance History</h1>
      <span id="workload-label" style="color:var(--muted);font-size:0.85rem;"></span>
    </div>
    <div class="controls" style="display:flex;gap:1rem;align-items:center;flex-wrap:wrap;margin:0;">
      <select id="platformSelect"></select>
      <select id="workloadSelect" style="display:none"></select>
    </div>
    <div style="display:flex;gap:0.4rem;">
      <button id="btn-prev-release" onclick="zoomAll('prevRelease')" class="zoom-btn">Since Previous Release</button>
      <button id="btn-last-release" onclick="zoomAll('lastRelease')" class="zoom-btn">Since Last Release</button>
      <button onclick="zoomAll('last100')" class="zoom-btn">Last 100 Commits</button>
      <button onclick="zoomAll('reset')" class="zoom-btn">Reset Zoom</button>
    </div>
    <a href="status.html" style="margin-left:auto;color:var(--muted);font-size:0.8rem;text-decoration:none;">Host Status ↗</a>
  </header>

  <!-- Throughput -->
  <div style="display:flex;align-items:center;margin-bottom:0.5rem;"><h2 style="margin:0">Throughput</h2><button class="help-btn" onclick="showHelp('throughput')">?</button></div>
  <div class="chart-panel chart-panel--throughput"><canvas id="chart"></canvas></div>
  <div id="chartInfo" class="info-row"></div>

  <!-- Latency Band Chart -->
  <div id="latencySection" style="display:none">
    <div style="display:flex;align-items:center;margin-bottom:0.5rem;"><h2 style="margin:0">Request Latency (distribution contour @ 70% load)</h2><button class="help-btn" onclick="showHelp('latency')">?</button></div>
    <div class="chart-panel chart-panel--throughput" style="position:relative"><canvas id="latencyChart"></canvas></div>
    <div id="latencyInfo" class="info-row"></div>
  </div>

  <!-- Perf Counters (skeleton: 4 placeholder slots) -->
  <div id="perfChartsSection">
    <div style="display:flex;align-items:center;margin-bottom:0.5rem;"><h2 style="margin:0">Performance Counters</h2><button class="help-btn" onclick="showHelp('perf')">?</button></div>
    <div id="perfCharts" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:0.75rem;">
      <div class="chart-panel chart-panel--perf"></div>
      <div class="chart-panel chart-panel--perf"></div>
      <div class="chart-panel chart-panel--perf"></div>
      <div class="chart-panel chart-panel--perf"></div>
    </div>
    <div id="perfInfo" class="info-row" style="margin-top:0.5rem;"></div>
  </div>

  <!-- Memory (2x2 grid for multiple workloads) -->
  <div style="display:flex;align-items:center;"><h2 style="margin:1.5rem 0 0.5rem">Memory Overhead (per-struct breakdown, 5M keys)</h2><button class="help-btn" onclick="showHelp('memory')">?</button></div>
  <div id="memoryChartsGrid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:0.75rem;"></div>
  <div id="memoryInfo" class="info-row"></div>

  <!-- Annotations & Table -->
  <h2 style="margin-bottom:0.75rem;">Notable Changes</h2>
  <div class="annotations" id="annotations"></div>
  <h2 style="margin:1.5rem 0 0.75rem;">Recent Data Points</h2>
  <div id="datapoints" style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:1rem;overflow-x:auto;max-height:400px;overflow-y:auto;"></div>

  <script src="config.js"></script>
  <script>
    Chart.defaults.scales.linear.afterFit = (axis) => { if (axis.position === 'left' || axis.position === 'right') axis.width = 60; };

    let chart = null, currentData = null, allCharts = [], manifest = null, perfChartInstances = [], globalMaxCommits = 0;

    // =========================================================================
    // Shared utilities
    // =========================================================================

    // Synced crosshair
    let crosshairX = null;
    Chart.register({
      id: 'syncedCrosshair',
      afterEvent(chart, args) {
        const evt = args.event;
        if (evt.type === 'mousemove' && chart.scales.x) {
          const xVal = chart.scales.x.getValueForPixel(evt.x);
          if (xVal != null && xVal !== crosshairX) { crosshairX = xVal; allCharts.forEach(c => c.draw()); }
        } else if (evt.type === 'mouseout') { crosshairX = null; allCharts.forEach(c => c.draw()); }
      },
      afterDraw(chart) {
        if (crosshairX == null || !chart.scales.x) return;
        const x = chart.scales.x.getPixelForValue(crosshairX);
        if (x < chart.chartArea.left || x > chart.chartArea.right) return;
        const ctx = chart.ctx; ctx.save(); ctx.beginPath();
        ctx.moveTo(x, chart.chartArea.top); ctx.lineTo(x, chart.chartArea.bottom);
        ctx.strokeStyle = 'rgba(99,102,241,0.4)'; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
      }
    });

    function syncZoom(src, min, max) { allCharts.forEach(c => { if (c !== src) { c.options.scales.x.min = min; c.options.scales.x.max = max; c.update('none'); } }); }

    function getVersionReleases(data) {
      const landmarks = (data.landmarks || []).filter(l => l.commit_index != null);
      return [...new Map(landmarks.map(l => [l.label, l])).values()]
        .filter(l => /^\d+\./.test(l.label))
        .sort((a, b) => a.commit_index - b.commit_index);
    }

    function zoomAll(mode) {
      if (!currentData) return;
      const tc = globalMaxCommits;
      const releases = getVersionReleases(currentData);
      let min = 0, max = tc + 1;
      if (mode === 'lastRelease') {
        const lm = releases.at(-1);
        if (lm) min = lm.commit_index;
      } else if (mode === 'prevRelease') {
        const lm = releases.at(-2);
        if (lm) min = lm.commit_index;
      } else if (mode === 'last100') { min = tc - 100; }
      allCharts.forEach(c => { c.options.scales.x.min = min; c.options.scales.x.max = max; c.update('none'); });
    }

    function getWorkloadId() { return document.getElementById('workloadSelect')?.value || (typeof THROUGHPUT_WORKLOADS !== 'undefined' ? THROUGHPUT_WORKLOADS[0].id : 'get-k16-v16-t7-p10'); }

    // Info row plugin: updates a fixed div on hover, shows default content otherwise
    function makeInfoPlugin(elId, formatter, defaultContent) {
      return {
        id: 'info_' + elId,
        afterEvent(chart, args) {
          const el = document.getElementById(elId); if (!el) return;
          if (args.event.type === 'mouseout') { el.innerHTML = defaultContent || ''; return; }
          if (args.event.type !== 'mousemove') return;
          const pts = chart.getElementsAtEventForMode(args.event, 'index', { intersect: false }, false);
          if (pts.length > 0) el.innerHTML = formatter(chart, pts[0].index);
        }
      };
    }

    // Format an info row item: <span class="info-val">value</span> label
    function infoItem(label, value) { return `<span><span class="info-val">${value}</span> ${label}</span>`; }

    // Common chart options
    function baseChartOpts(totalCommits, landmarks) {
      const annotations = {};
      (landmarks || []).forEach((lm, i) => {
        if (lm.commit_index != null) annotations[`lm${i}`] = {
          type: 'line', xMin: lm.commit_index, xMax: lm.commit_index,
          borderColor: 'rgba(100,116,139,0.5)', borderWidth: 1, borderDash: [4, 3],
          label: { display: true, content: lm.label, position: 'start', font: { size: 10 }, color: '#64748b' }
        };
      });
      return {
        responsive: true, maintainAspectRatio: false,
        interaction: { intersect: false, mode: 'index' },
        plugins: {
          tooltip: { enabled: false },
          annotation: { annotations },
          zoom: { zoom: { drag: { enabled: true, backgroundColor: 'rgba(100,100,100,0.15)' }, mode: 'x', onZoomComplete: ({chart: c}) => syncZoom(c, c.scales.x.min, c.scales.x.max) } },
        },
        scales: {
          x: { type: 'linear', min: 0, max: totalCommits + 1, ticks: { color: '#64748b', maxTicksLimit: 8 }, grid: { color: 'var(--border)' } },
        }
      };
    }

    // =========================================================================
    // Init & Render
    // =========================================================================

    async function init() {
      await loadManifest();
      // Populate workload selector
      const wlSel = document.getElementById('workloadSelect');
      const workloads = typeof THROUGHPUT_WORKLOADS !== 'undefined' ? THROUGHPUT_WORKLOADS : [{ id: 'get-k16-v16-t7-p10', label: 'GET k16 v16' }];
      for (const wl of workloads) {
        const o = document.createElement('option'); o.value = wl.id; o.textContent = wl.label; wlSel.appendChild(o);
      }
      if (workloads.length > 1) wlSel.style.display = '';
      wlSel.addEventListener('change', () => render(document.getElementById('platformSelect').value));

      const sel = document.getElementById('platformSelect');
      for (const p of PLATFORMS) {
        try {
          const r = await fetch(`${DATA_URL}/series-${p}-${getWorkloadId()}-throughput.json`);
          if (r.ok) { const o = document.createElement('option'); o.value = p; o.textContent = PLATFORM_LABELS[p] || p; sel.appendChild(o); }
        } catch {}
      }
      sel.addEventListener('change', () => render(sel.value));
      if (sel.options.length > 0) render(sel.value);
    }

    async function render(platform) {
      const resp = await fetch(`${DATA_URL}/series-${platform}-${getWorkloadId()}-throughput.json`);
      if (!resp.ok) return;
      const data = await resp.json(); currentData = data;
      const workload = data.workloads[0];
      document.getElementById('workload-label').textContent = 'Workload: ' + workload;

      // Update release button labels with version numbers (sorted, version-only)
      const releases = getVersionReleases(data);
      const lastRel = releases.at(-1), prevRel = releases.at(-2);
      document.getElementById('btn-last-release').textContent = lastRel ? `Since ${lastRel.label}` : 'Since Last Release';
      document.getElementById('btn-prev-release').textContent = prevRel ? `Since ${prevRel.label}` : 'Since Previous Release';

      const points = data.points.filter(p => p.results[workload]).sort((a, b) => a.commit_index - b.commit_index);
      currentPoints = points; currentWorkload = workload;
      const rpsValues = points.map(p => p.results[workload].rps);
      const maxRps = Math.max(...rpsValues), minRps = Math.min(...rpsValues), latestRps = rpsValues.at(-1);

      // Default info row content (stats)
      const defaultInfo = [
        infoItem('points', points.length),
        infoItem('latest', (latestRps/1e6).toFixed(3)+'M'),
        infoItem('peak', (maxRps/1e6).toFixed(3)+'M'),
        infoItem('range', '±'+(((maxRps-minRps)/((maxRps+minRps)/2))*50).toFixed(1)+'%'),
        infoItem('annotations', data.annotations.length),
      ].join('');
      document.getElementById('chartInfo').innerHTML = defaultInfo;

      // Annotation map
      const annMap = {}; data.annotations.forEach(a => { annMap[a.commit] = a; });
      const ptColors = points.map(p => { const a = annMap[p.commit]; return a ? (a.good ? '#22c55e' : '#ef4444') : '#6366f1'; });
      const ptRadii = points.map(p => annMap[p.commit] ? 6 : 3);

      // Throughput chart
      if (chart) chart.destroy(); allCharts = [];
      globalMaxCommits = Math.max(globalMaxCommits, data.metadata.total_commits);
      const opts = baseChartOpts(data.metadata.total_commits, data.landmarks);
      opts.plugins.legend = { display: false };
      opts.scales.y = { title: { display: true, text: 'M ops/sec', color: '#64748b' }, ticks: { color: '#64748b', callback: v => (v/1e6).toFixed(1)+'M' }, grid: { color: 'var(--border)' } };
      opts.onClick = (evt, els) => {
        // Distinguish click from drag (zoom): if mouse moved >5px, it's a drag
        if (mouseDownPos && (Math.abs(evt.native.clientX - mouseDownPos.x) > 5 || Math.abs(evt.native.clientY - mouseDownPos.y) > 5)) return;
        if (!els.length) return;
        // Find nearest point from main dataset (index 2 = the line)
        const el = els.find(e => e.datasetIndex === 2) || els[0];
        const idx = el.index;
        const point = points[idx];
        const prevPoint = findPrevPoint(points, idx);
        showCommitPopup(point, prevPoint, workload, evt.native);
      };

      const cvUpper = points.map(p => { const r = p.results[workload]; return { x: p.commit_index, y: r.rps * (1 + (r.cv||0)/100) }; });
      const cvLower = points.map(p => { const r = p.results[workload]; return { x: p.commit_index, y: r.rps * (1 - (r.cv||0)/100) }; });

      chart = new Chart(document.getElementById('chart').getContext('2d'), {
        type: 'line',
        plugins: [makeInfoPlugin('chartInfo', (_, idx) => {
          const p = points[idx], r = p.results[workload];
          return [
            infoItem('', p.date), `${p.commit.slice(0,8)}${p.pr ? ' #'+p.pr : ''}`,
            infoItem('ops/sec', (r.rps/1e6).toFixed(3)+'M'),
            infoItem('CV', r.cv.toFixed(2)+'%'),
            p.pr_title || '',
          ].filter(Boolean).join('<span class="info-sep"> · </span>');
        }, defaultInfo)],
        data: { datasets: [
          { label: 'CV+', data: cvUpper, borderColor: 'transparent', backgroundColor: 'rgba(99,102,241,0.15)', fill: '+1', pointRadius: 0, tension: 0 },
          { label: 'CV-', data: cvLower, borderColor: 'transparent', fill: false, pointRadius: 0, tension: 0 },
          { label: 'ops/sec', data: points.map(p => ({x: p.commit_index, y: p.results[workload].rps})), borderColor: '#6366f1', backgroundColor: 'transparent', pointBackgroundColor: ptColors, pointRadius: ptRadii, tension: 0 },
        ]},
        options: opts,
      });
      allCharts.push(chart);

      // Memory, Perf, Latency, Annotations, Table (parallel)
      await Promise.all([renderMemory(platform, data), renderPerfCharts(platform), renderLatency(platform)]);
      renderAnnotations(data);
      renderTable(points, workload);
    }

    // =========================================================================
    // Memory chart
    // =========================================================================

    let memoryChartInstances = [];

    async function renderMemory(platform, mainData) {
      memoryChartInstances.forEach(c => c.destroy()); memoryChartInstances = [];
      const container = document.getElementById('memoryChartsGrid'); container.innerHTML = '';

      for (const workloadId of MEMORY_WORKLOADS) {
        try {
          const r = await fetch(`${DATA_URL}/series-${platform}-${workloadId}-memory.json`);
          if (!r.ok) continue;
          const memData = await r.json();
          const wk = memData.workloads[0];
          const pts = memData.points.filter(p => p.results[wk]).sort((a, b) => a.commit_index - b.commit_index);
          if (!pts.length) continue;

          const hasBreakdown = memData.metadata.categories && pts.some(p => p.breakdown);
          let datasets;
          if (hasBreakdown) {
            datasets = memData.metadata.categories.map((cat, i) => ({
              label: cat, data: pts.map(p => ({x: p.commit_index, y: p.breakdown?.[cat] || 0})),
              borderColor: CATEGORY_COLORS[cat] || '#6b7280', backgroundColor: (CATEGORY_COLORS[cat] || '#6b7280') + '99',
              fill: i === 0 ? 'origin' : '-1', pointRadius: 0, borderWidth: 1, tension: 0,
            }));
          } else {
            datasets = [{ label: 'bytes/key', data: pts.map(p => ({x: p.commit_index, y: p.results[wk].rps})), borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: 'origin', pointRadius: 3, tension: 0 }];
          }

          // Create chart container
          const div = document.createElement('div'); div.className = 'chart-panel chart-panel--memory';
          const label = workloadId.replace('memory-', '').replace('-', ' ');
          div.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.3rem">${label}</div><canvas></canvas>`;
          container.appendChild(div);

          globalMaxCommits = Math.max(globalMaxCommits, memData.metadata.total_commits);
          const opts = baseChartOpts(memData.metadata.total_commits, memData.landmarks);
          opts.plugins.legend = { display: hasBreakdown, position: 'bottom', labels: { boxWidth: 10, font: { size: 9 }, color: '#94a3b8', padding: 8, filter: (item, data) => data.datasets[item.datasetIndex].data.some(d => d.y > 0) } };
          const yMax = hasBreakdown ? Math.max(...pts.map(p => Object.values(p.breakdown || {}).reduce((s,v)=>s+v,0))) : Math.max(...pts.map(p => p.results[wk].rps));
          opts.scales.y = { stacked: hasBreakdown, beginAtZero: true, suggestedMax: yMax * 1.05, title: { display: true, text: 'B/key', color: '#64748b' }, ticks: { color: '#64748b', font: { size: 9 } }, grid: { color: 'var(--border)' } };

          // User data baseline line
          const userDataBytes = MEMORY_USER_DATA[workloadId];
          if (userDataBytes) {
            opts.plugins.annotation.annotations.userDataLine = {
              type: 'line', yMin: userDataBytes, yMax: userDataBytes,
              borderColor: '#94a3b8', borderWidth: 1, borderDash: [5, 3],
              label: { display: true, content: `user data: ${userDataBytes}B`, position: 'start', font: { size: 9 }, color: '#94a3b8', backgroundColor: 'rgba(30,41,59,0.85)', padding: 3, yAdjust: -10 },
            };
          }

          // Click to show commit popup with memory breakdown
          opts.onClick = ((memPts, memWk, memLabel) => (evt, els) => {
            if (mouseDownPos && (Math.abs(evt.native.clientX - mouseDownPos.x) > 5 || Math.abs(evt.native.clientY - mouseDownPos.y) > 5)) return;
            if (!els.length) return;
            const idx = els[0].index;
            const point = memPts[idx];
            const prev = idx > 0 ? memPts[idx - 1] : null;
            showMemoryPopup(point, prev, memWk, memLabel, evt.native);
          })(pts, wk, label);

          const ci = new Chart(div.querySelector('canvas').getContext('2d'), {
            type: 'line', data: { datasets },
            plugins: [makeInfoPlugin('memoryInfo', (_, idx) => {
              const p = pts[idx];
              let items = [infoItem('', label), infoItem('', p.date), p.commit.slice(0,8) + (p.pr ? ' #'+p.pr : '')];
              if (p.breakdown) {
                const total = Object.values(p.breakdown).reduce((s,v)=>s+v,0);
                items.push(infoItem('total', total.toFixed(1)+' B/key'));
                Object.entries(p.breakdown).filter(([,v])=>v>0.1).forEach(([k,v]) => {
                  const c = CATEGORY_COLORS[k] || '#6b7280';
                  items.push(`<span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c};margin-right:3px;vertical-align:middle;"></span><span class="info-val">${v.toFixed(1)}</span> ${k}</span>`);
                });
              } else { items.push(infoItem('overhead', p.results[wk].rps.toFixed(1)+' B/key')); }
              if (p.pr_title) items.push(p.pr_title);
              return items.filter(Boolean).join('<span class="info-sep"> · </span>');
            })],
            options: opts,
          });
          memoryChartInstances.push(ci); allCharts.push(ci);
        } catch(e) { console.error('Memory chart ' + workloadId + ':', e); }
      }
    }

    // =========================================================================
    // Perf charts (including TMA as 100% stacked area)
    // =========================================================================

    async function renderPerfCharts(platform) {
      perfChartInstances.forEach(c => c.destroy()); perfChartInstances = [];
      popupPerfData = {};
      if (!manifest) return;
      const container = document.getElementById('perfCharts'); container.innerHTML = '';
      const workloadId = getWorkloadId();
      const perfGroups = manifest.groups.filter(g => !['throughput', 'memory'].includes(g.id));
      let hasAny = false;

      for (const group of perfGroups) {
        const datasets = []; let maxIdx = 0; let colorIdx = 0;
        const isTMA = group.id === 'tma';

        if (isTMA) {
          // Fetch all TMA series, then build cumulative stacked area (like memory breakdown)
          const rawSeries = [];
          for (const metricId of group.series) {
            try {
              const r = await fetch(`${DATA_URL}/series-${platform}-${workloadId}-${metricId}.json`);
              if (!r.ok) continue;
              const sd = await r.json();
              const pts = sd.points.sort((a, b) => a.commit_index - b.commit_index);
              if (!pts.length) continue;
              maxIdx = Math.max(maxIdx, pts.at(-1).commit_index);
              rawSeries.push({ metricId, pts });
            } catch { continue; }
          }
          // Build cumulative datasets: each dataset y = sum of this + all previous
          for (let i = 0; i < rawSeries.length; i++) {
            const { metricId, pts } = rawSeries[i];
            const color = CATEGORY_COLORS[metricId] || CHART_COLORS[i % CHART_COLORS.length];
            const cumData = pts.map((p, pi) => {
              let cumY = 0;
              for (let j = 0; j <= i; j++) cumY += rawSeries[j].pts[pi]?.value || 0;
              return { x: p.commit_index, y: cumY };
            });
            datasets.push({
              label: metricId.replace('tma-', '').replace('-pct', ''), data: cumData,
              borderColor: color, backgroundColor: color + '99',
              fill: i === 0 ? 'origin' : '-1',
              pointRadius: 0, borderWidth: 1, tension: 0,
            });
          }
        } else {
        for (const metricId of group.series) {
          try {
            const r = await fetch(`${DATA_URL}/series-${platform}-${workloadId}-${metricId}.json`);
            if (!r.ok) continue;
            const sd = await r.json();
            const pts = sd.points.sort((a, b) => a.commit_index - b.commit_index);
            if (!pts.length) continue;
            popupPerfData[metricId] = pts;
            maxIdx = Math.max(maxIdx, pts.at(-1).commit_index);
            const color = CATEGORY_COLORS[metricId] || CHART_COLORS[colorIdx % CHART_COLORS.length];
            datasets.push({
              label: metricId, data: pts.map(p => ({x: p.commit_index, y: p.value})),
              borderColor: color, backgroundColor: 'transparent',
              fill: false,
              pointRadius: 3, pointBackgroundColor: color, borderWidth: 1, tension: 0,
              yAxisID: group.y_axes?.find(a => a.series.includes(metricId))?.id || 'left',
            });
            colorIdx++;
          } catch { continue; }
        }
        }
        if (!datasets.length) continue; hasAny = true;

        const div = document.createElement('div'); div.className = 'chart-panel chart-panel--perf';
        const helpBtn = isTMA ? `<button class="help-btn" onclick="showHelp('tma')" style="margin-left:0.3rem">?</button>` : '';
        div.innerHTML = `<div style="font-size:0.8rem;color:var(--muted);margin-bottom:0.3rem">${group.title}${helpBtn}</div><canvas></canvas>`;
        container.appendChild(div);

        const scales = { x: { type: 'linear', min: 0, max: maxIdx, ticks: { color: '#64748b', maxTicksLimit: 6 }, grid: { color: 'var(--border)' } } };
        if (isTMA) {
          scales.y = { title: { display: true, text: '%', color: '#64748b' }, ticks: { color: '#64748b' }, grid: { color: 'var(--border)' } };
        } else {
          for (const axis of (group.y_axes || [{id:'left',label:'',series:[]}])) {
            scales[axis.id] = { position: axis.id === 'right' ? 'right' : 'left', title: { display: true, text: axis.label, color: '#64748b' }, ticks: { color: '#64748b', callback: v => v >= 1000 ? (v/1000).toPrecision(3)+'k' : v >= 10 ? Math.round(v) : v.toPrecision(3) }, grid: { color: axis.id === 'left' ? 'var(--border)' : 'transparent' } };
          }
        }

        const ci = new Chart(div.querySelector('canvas').getContext('2d'), {
          type: 'line', data: { datasets },
          plugins: [makeInfoPlugin('perfInfo', (_, idx) => {
            if (isTMA) {
              return datasets.map((ds, i) => { const pt = ds.data[idx]; if (!pt) return ''; const prev = i > 0 ? datasets[i-1].data[idx]?.y || 0 : 0; return infoItem(ds.label, (pt.y - prev).toFixed(1) + '%'); }).filter(Boolean).join('<span class="info-sep"> · </span>');
            }
            return datasets.map(ds => { const pt = ds.data[idx]; return pt ? infoItem(ds.label, pt.y.toFixed(2)) : ''; }).filter(Boolean).join('<span class="info-sep"> · </span>');
          })],
          options: { responsive: true, maintainAspectRatio: false, interaction: { intersect: false, mode: 'index' }, plugins: { legend: { display: datasets.length > 1, position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } }, tooltip: { enabled: false }, zoom: { zoom: { drag: { enabled: true, backgroundColor: 'rgba(100,100,100,0.15)' }, mode: 'x', onZoomComplete: ({chart:c}) => syncZoom(c, c.scales.x.min, c.scales.x.max) } } }, scales },
        });
        perfChartInstances.push(ci); allCharts.push(ci);
      }
      document.getElementById('perfChartsSection').style.opacity = hasAny ? '1' : '0.3';
    }

    // =========================================================================
    // Latency band chart
    // =========================================================================

    let latencyChartInstance = null;

    async function renderLatency(platform) {
      if (latencyChartInstance) { latencyChartInstance.destroy(); allCharts = allCharts.filter(c => c !== latencyChartInstance); latencyChartInstance = null; }
      const section = document.getElementById('latencySection');
      const workloadId = getWorkloadId();
      let resp;
      try { resp = await fetch(`${DATA_URL}/series-${platform}-${workloadId}-latency.json`); } catch { section.style.display = 'none'; return; }
      if (!resp.ok) { section.style.display = 'none'; return; }
      section.style.display = '';
      const data = await resp.json();
      const pts = data.points.sort((a, b) => a.commit_index - b.commit_index);
      if (!pts.length) { section.style.display = 'none'; return; }

      const totalCommits = data.metadata.total_commits;
      globalMaxCommits = Math.max(globalMaxCommits, totalCommits);
      // Histogram indices: 0=p1, 1=p10, 2=p25, 3=p50, 4=p75, 5=p90, 6=p95, 7=p99, 8=p99.5, 9=p99.9, 10=p100
      // We use indices 1-9 (p10 through p99.9), skip p1 and p100
      const subtle = 'rgba(148,163,184,0.45)';
      const lineCfg = [
        { hi: 1, color: subtle, w: 1, dash: [] },         // p10
        { hi: 2, color: subtle, w: 1, dash: [] },         // p25
        { hi: 3, color: '#22c55e', w: 2, dash: [] },      // p50 — green
        { hi: 4, color: subtle, w: 1, dash: [] },         // p75
        { hi: 5, color: subtle, w: 1, dash: [] },         // p90
        { hi: 6, color: subtle, w: 1, dash: [] },         // p95
        { hi: 7, color: '#6366f1', w: 2.5, dash: [] },    // p99 — indigo
        { hi: 8, color: subtle, w: 1, dash: [] },         // p99.5
        { hi: 9, color: '#ef4444', w: 2, dash: [4,3] },   // p99.9 — red dashed
      ];
      const pctLabels = ['p10','p25','p50','p75','p90','p95','p99','p99.5','p99.9'];

      const datasets = lineCfg.map((cfg, i) => ({
        label: pctLabels[i],
        data: pts.map(p => ({ x: p.commit_index, y: p.histogram?.[cfg.hi]?.[1] || 0 })),
        borderColor: cfg.color, borderWidth: cfg.w, borderDash: cfg.dash,
        pointRadius: 0, fill: false, tension: 0.3,
      }));

      const latestH = pts.at(-1).histogram || [];
      const defaultInfo = [
        infoItem('points', pts.length),
        infoItem('p50', formatUs(latestH[3]?.[1] || pts.at(-1).p50_us)),
        infoItem('p99', formatUs(latestH[7]?.[1] || pts.at(-1).p99_us)),
        infoItem('p99.9', formatUs(latestH[9]?.[1] || pts.at(-1).p99_9_us)),
        infoItem('load', (pts.at(-1).target_rps/1e6).toFixed(2)+'M (70%)'),
      ].join('');
      document.getElementById('latencyInfo').innerHTML = defaultInfo;

      const opts = baseChartOpts(totalCommits, data.landmarks);
      opts.plugins.legend = { display: true, position: 'bottom', labels: { boxWidth: 14, font: { size: 10 }, color: '#94a3b8', filter: item => ['p50','p99','p99.9'].includes(item.text) } };
      opts.scales.y = { type: 'linear', ticks: { color: '#64748b', callback: v => formatUs(v) }, grid: { color: 'var(--border)' } };
      opts.plugins.tooltip = { enabled: false };

      // Click to show commit popup with latency percentiles
      opts.onClick = (evt, els) => {
        if (mouseDownPos && (Math.abs(evt.native.clientX - mouseDownPos.x) > 5 || Math.abs(evt.native.clientY - mouseDownPos.y) > 5)) return;
        if (!els.length) return;
        const idx = els[0].index;
        const point = pts[idx];
        const prev = idx > 0 ? pts[idx - 1] : null;
        showLatencyPopup(point, prev, lineCfg, pctLabels, evt.native);
      };

      latencyChartInstance = new Chart(document.getElementById('latencyChart').getContext('2d'), {
        type: 'line', data: { datasets },
        plugins: [makeInfoPlugin('latencyInfo', (_, idx) => {
          const p = pts[idx];
          const h = p.histogram || [];
          return [
            infoItem('', p.date), p.commit.slice(0,8) + (p.pr ? ' #'+p.pr : ''),
            ...pctLabels.map((lbl, i) => infoItem(lbl, formatUs(h[lineCfg[i].hi]?.[1] || 0))),
            infoItem('load', (p.actual_rps/1e6).toFixed(2)+'M'),
            p.pr_title || '',
          ].filter(Boolean).join('<span class="info-sep"> · </span>');
        }, defaultInfo)],
        options: opts,
      });
      allCharts.push(latencyChartInstance);
    }

    function formatUs(us) { return us >= 1000 ? (us/1000).toFixed(2)+'ms' : Math.round(us)+'µs'; }

    // =========================================================================
    // Annotations & Table
    // =========================================================================

    function renderAnnotations(data) {
      const el = document.getElementById('annotations');
      const sorted = [...data.annotations].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
      el.innerHTML = sorted.map(a => `
        <div class="annotation ${a.good ? 'good' : 'bad'}">
          <div>
            <div><strong>${a.pr_title || a.commit.slice(0,8)}</strong></div>
            <div class="meta"><a href="https://github.com/valkey-io/valkey/commit/${a.commit}" target="_blank">${a.commit.slice(0,8)}</a>${a.pr ? ` · <a href="https://github.com/valkey-io/valkey/pull/${a.pr}" target="_blank">PR #${a.pr}</a>` : ''}</div>
          </div>
          <div class="delta ${a.delta < 0 ? 'neg' : 'pos'}">${a.delta > 0 ? '+' : ''}${(a.delta*100).toFixed(1)}%</div>
        </div>`).join('');
    }

    function renderTable(points, workload) {
      const el = document.getElementById('datapoints'); if (!el) return;
      const rows = points.slice().reverse().map(p => {
        const r = p.results[workload];
        const link = p.pr ? `<a href="https://github.com/valkey-io/valkey/pull/${p.pr}" target="_blank">#${p.pr}</a>` : p.commit.slice(0,8);
        return `<tr id="row-${p.commit.slice(0,10)}"><td>${p.date}</td><td>${link}</td><td style="color:var(--text)">${(p.pr_title||'').slice(0,50)}</td><td>${(r.rps/1000).toFixed(0)}K</td><td>${(r.cv||0).toFixed(2)}%</td></tr>`;
      }).join('');
      el.innerHTML = `<table style="width:100%;font-size:0.8rem;border-collapse:collapse;"><thead><tr style="color:var(--muted);text-align:left;"><th>Date</th><th>PR</th><th>Title</th><th>RPS</th><th>CV</th></tr></thead><tbody>${rows}</tbody></table>`;
    }

    async function loadManifest() { try { const r = await fetch(`${DATA_URL}/manifest.json`); if (r.ok) manifest = await r.json(); } catch {} }

    // =========================================================================
    // Commit detail popup
    // =========================================================================

    let popupPerfData = {}; // metricId -> sorted points array (populated during renderPerfCharts)

    // Precision-aware RPS formatting: sig figs based on CV
    function formatRpsPrecision(rps, cv) {
      const sigFigs = Math.max(2, Math.min(4, Math.floor(-Math.log10(Math.max(cv, 0.01) / 100))));
      const millions = rps / 1e6;
      return millions.toPrecision(sigFigs) + 'M';
    }

    // Find previous measured point in the sorted points array
    function findPrevPoint(points, idx) {
      return idx > 0 ? points[idx - 1] : null;
    }

    // Compute combined uncertainty for delta between two points
    function combinedUncertainty(cv1, cv2) {
      return Math.sqrt((cv1 || 0) ** 2 + (cv2 || 0) ** 2);
    }

    function showCommitPopup(point, prevPoint, workload, evt) {
      const popup = document.getElementById('commitPopup');
      const r = point.results[workload];
      const repo = currentData.metadata.repo || 'valkey-io/valkey';
      const hash = point.commit;
      const shortHash = hash.slice(0, 7);

      // RPS and CV
      const rpsStr = formatRpsPrecision(r.rps, r.cv || 0);

      // Delta
      let deltaHtml = '';
      if (prevPoint) {
        const prevR = prevPoint.results[workload];
        const delta = ((r.rps - prevR.rps) / prevR.rps) * 100;
        const unc = combinedUncertainty(r.cv, prevR.cv);
        const gap = point.commit_index - prevPoint.commit_index;
        const gapText = gap === 1 ? 'vs previous commit' : `vs ${gap} commits ago`;
        const isSignificant = Math.abs(delta) > unc;
        const isUp = delta > 0;

        let cls, arrow, badgeCls, badgeText;
        if (!isSignificant) {
          cls = 'cpop-delta-noise'; arrow = '△'; badgeCls = 'cpop-badge-noise'; badgeText = 'in noise';
        } else if (isUp) {
          cls = 'cpop-delta-sig-up'; arrow = '▲'; badgeCls = 'cpop-badge-sig'; badgeText = 'significant';
        } else {
          cls = 'cpop-delta-sig-down'; arrow = '▼'; badgeCls = 'cpop-badge-regress'; badgeText = 'regression';
        }
        const sign = delta > 0 ? '+' : '';
        deltaHtml = `<div class="cpop-delta ${cls}"><span>${arrow} ${sign}${delta.toFixed(1)}% ±${unc.toFixed(1)}%</span><span class="cpop-badge ${badgeCls}">${badgeText}</span><span style="color:var(--muted);font-weight:400;font-size:12px">${gapText}</span></div>`;
      }

      // Perf counters (from loaded data)
      let perfHtml = '';
      const perfMetrics = Object.keys(popupPerfData);
      if (perfMetrics.length) {
        const items = [];
        for (const metricId of perfMetrics) {
          const pts = popupPerfData[metricId];
          const mp = pts.find(p => p.commit_index === point.commit_index);
          if (!mp) continue;
          const prevMp = prevPoint ? pts.find(p => p.commit_index === prevPoint.commit_index) : null;
          let deltaStr = '';
          if (prevMp) {
            const d = mp.value - prevMp.value;
            const sign = d > 0 ? '+' : '';
            // For "insn/req" lower is better, for IPC higher is better
            const isGood = metricId === 'ipc' ? d > 0 : d < 0;
            const dCls = Math.abs(d) < 0.01 * Math.abs(mp.value) ? 'cpop-delta-noise' : (isGood ? 'cpop-delta-sig-up' : 'cpop-delta-sig-down');
            deltaStr = `<div class="cpop-perf-d ${dCls}">${sign}${d >= 100 ? Math.round(d) : d.toFixed(2)}</div>`;
          }
          const label = metricId.replace(/-/g, ' ').replace('pct', '%');
          const val = mp.value >= 100 ? Math.round(mp.value).toLocaleString() : mp.value.toFixed(2);
          items.push(`<div class="cpop-perf-item"><div class="cpop-perf-name">${label}</div><div class="cpop-perf-val">${val}</div>${deltaStr}</div>`);
        }
        if (items.length) {
          perfHtml = `<div class="cpop-perf"><div class="cpop-perf-label">Perf counters</div><div class="cpop-perf-grid">${items.join('')}</div></div>`;
        }
      }

      // Platform label
      const platLabel = PLATFORM_LABELS[document.getElementById('platformSelect').value] || '';

      popup.innerHTML = `<div class="cpop" style="position:relative">
        <button class="cpop-close" onclick="hideCommitPopup()">✕</button>
        <div class="cpop-header">
          <a class="cpop-hash" href="https://github.com/${repo}/commit/${hash}" target="_blank">${shortHash}</a>
          <span class="cpop-date">${point.date}</span>
        </div>
        <div class="cpop-title">${point.pr_title || shortHash}${point.pr ? '' : ''}</div>
        <div class="cpop-links">
          ${point.pr ? `<a href="https://github.com/${repo}/pull/${point.pr}" target="_blank">🔗 PR #${point.pr}</a>` : ''}
          <a href="https://github.com/${repo}/commit/${hash}" target="_blank">📄 Commit</a>
        </div>
        <hr class="cpop-sep">
        <div class="cpop-rps">${rpsStr} <span class="cpop-rps-unit">rps</span></div>
        <div class="cpop-cv">${r.reps || '?'} reps · CV ${(r.cv||0).toFixed(2)}%</div>
        ${deltaHtml}
        ${perfHtml ? '<hr class="cpop-sep">' + perfHtml : ''}
        <div class="cpop-footer"><span>Esc to dismiss</span><span>${platLabel}</span></div>
      </div>`;

      // Position near click but within viewport
      popup.style.display = 'block';
      const rect = popup.getBoundingClientRect();
      let left = evt.clientX + 12;
      let top = evt.clientY - 20;
      if (left + rect.width > window.innerWidth - 16) left = evt.clientX - rect.width - 12;
      if (top + rect.height > window.innerHeight - 16) top = window.innerHeight - rect.height - 16;
      if (top < 8) top = 8;
      popup.style.left = left + 'px';
      popup.style.top = top + 'px';
    }

    function hideCommitPopup() { document.getElementById('commitPopup').style.display = 'none'; }

    function showMemoryPopup(point, prevPoint, wk, label, evt) {
      const popup = document.getElementById('commitPopup');
      const repo = currentData.metadata.repo || 'valkey-io/valkey';
      const hash = point.commit;
      const shortHash = hash.slice(0, 7);

      // Memory value
      const total = point.breakdown ? Object.values(point.breakdown).reduce((s,v)=>s+v,0) : point.results[wk].rps;
      let deltaHtml = '';
      if (prevPoint) {
        const prevTotal = prevPoint.breakdown ? Object.values(prevPoint.breakdown).reduce((s,v)=>s+v,0) : prevPoint.results[wk].rps;
        const delta = ((total - prevTotal) / prevTotal) * 100;
        const gap = point.commit_index - prevPoint.commit_index;
        const gapText = gap === 1 ? 'vs previous commit' : `vs ${gap} commits ago`;
        // Memory is deterministic (CV=0), so any change > 0.1% is significant
        const isSignificant = Math.abs(delta) > 0.1;
        const isUp = delta > 0; // for memory, up = bad (more overhead)
        let cls, arrow, badgeCls, badgeText;
        if (!isSignificant) {
          cls = 'cpop-delta-noise'; arrow = '△'; badgeCls = 'cpop-badge-noise'; badgeText = 'unchanged';
        } else if (isUp) {
          cls = 'cpop-delta-sig-down'; arrow = '▲'; badgeCls = 'cpop-badge-regress'; badgeText = 'increased';
        } else {
          cls = 'cpop-delta-sig-up'; arrow = '▼'; badgeCls = 'cpop-badge-sig'; badgeText = 'reduced';
        }
        const sign = delta > 0 ? '+' : '';
        const absDelta = Math.abs(total - prevTotal).toFixed(1);
        deltaHtml = `<div class="cpop-delta ${cls}"><span>${arrow} ${sign}${delta.toFixed(1)}% (${sign}${(total-prevTotal).toFixed(1)} B/key)</span><span class="cpop-badge ${badgeCls}">${badgeText}</span><span style="color:var(--muted);font-weight:400;font-size:12px">${gapText}</span></div>`;
      }

      // Breakdown grid
      let breakdownHtml = '';
      if (point.breakdown) {
        const entries = Object.entries(point.breakdown).filter(([,v]) => v > 0.1).sort((a,b) => b[1]-a[1]);
        const items = entries.map(([cat, val]) => {
          const c = CATEGORY_COLORS[cat] || '#6b7280';
          let dStr = '';
          if (prevPoint?.breakdown) {
            const prevVal = prevPoint.breakdown[cat] || 0;
            const d = val - prevVal;
            if (Math.abs(d) > 0.05) {
              const sign = d > 0 ? '+' : '';
              const dCls = d > 0 ? 'cpop-delta-sig-down' : 'cpop-delta-sig-up';
              dStr = `<div class="cpop-perf-d ${dCls}">${sign}${d.toFixed(1)}</div>`;
            }
          }
          return `<div class="cpop-perf-item"><div class="cpop-perf-name" style="color:${c}">${cat}</div><div class="cpop-perf-val">${val.toFixed(1)}</div>${dStr}</div>`;
        });
        breakdownHtml = `<div class="cpop-perf"><div class="cpop-perf-label">Breakdown (B/key)</div><div class="cpop-perf-grid" style="grid-template-columns:1fr 1fr">${items.join('')}</div></div>`;
      }

      const platLabel = PLATFORM_LABELS[document.getElementById('platformSelect').value] || '';
      popup.innerHTML = `<div class="cpop" style="position:relative">
        <button class="cpop-close" onclick="hideCommitPopup()">✕</button>
        <div class="cpop-header">
          <a class="cpop-hash" href="https://github.com/${repo}/commit/${hash}" target="_blank">${shortHash}</a>
          <span class="cpop-date">${point.date}</span>
        </div>
        <div class="cpop-title">${point.pr_title || shortHash}</div>
        <div class="cpop-links">
          ${point.pr ? `<a href="https://github.com/${repo}/pull/${point.pr}" target="_blank">🔗 PR #${point.pr}</a>` : ''}
          <a href="https://github.com/${repo}/commit/${hash}" target="_blank">📄 Commit</a>
        </div>
        <hr class="cpop-sep">
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">${label}</div>
        <div class="cpop-rps">${total.toFixed(1)} <span class="cpop-rps-unit">B/key</span></div>
        <div class="cpop-cv">deterministic (CV ≈ 0%)</div>
        ${deltaHtml}
        ${breakdownHtml ? '<hr class="cpop-sep">' + breakdownHtml : ''}
        <div class="cpop-footer"><span>Esc to dismiss</span><span>${platLabel}</span></div>
      </div>`;

      popup.style.display = 'block';
      const rect = popup.getBoundingClientRect();
      let left = evt.clientX + 12, top = evt.clientY - 20;
      if (left + rect.width > window.innerWidth - 16) left = evt.clientX - rect.width - 12;
      if (top + rect.height > window.innerHeight - 16) top = window.innerHeight - rect.height - 16;
      if (top < 8) top = 8;
      popup.style.left = left + 'px'; popup.style.top = top + 'px';
    }

    function showLatencyPopup(point, prevPoint, lineCfg, pctLabels, evt) {
      const popup = document.getElementById('commitPopup');
      const repo = currentData.metadata.repo || 'valkey-io/valkey';
      const hash = point.commit;
      const shortHash = hash.slice(0, 7);
      const h = point.histogram || [];

      // Primary metric: p99
      const p99 = h[7]?.[1] || 0;
      const p50 = h[3]?.[1] || 0;
      const p999 = h[9]?.[1] || 0;

      let deltaHtml = '';
      if (prevPoint) {
        const prevH = prevPoint.histogram || [];
        const prevP99 = prevH[7]?.[1] || 0;
        if (prevP99 > 0 && p99 > 0) {
          const delta = ((p99 - prevP99) / prevP99) * 100;
          const gap = point.commit_index - prevPoint.commit_index;
          const gapText = gap === 1 ? 'vs previous commit' : `vs ${gap} commits ago`;
          const isSignificant = Math.abs(delta) > 2; // 2% threshold for latency
          const isUp = delta > 0; // for latency, up = bad
          let cls, arrow, badgeCls, badgeText;
          if (!isSignificant) {
            cls = 'cpop-delta-noise'; arrow = '△'; badgeCls = 'cpop-badge-noise'; badgeText = 'stable';
          } else if (isUp) {
            cls = 'cpop-delta-sig-down'; arrow = '▲'; badgeCls = 'cpop-badge-regress'; badgeText = 'slower';
          } else {
            cls = 'cpop-delta-sig-up'; arrow = '▼'; badgeCls = 'cpop-badge-sig'; badgeText = 'faster';
          }
          const sign = delta > 0 ? '+' : '';
          deltaHtml = `<div class="cpop-delta ${cls}"><span>${arrow} ${sign}${delta.toFixed(1)}% p99</span><span class="cpop-badge ${badgeCls}">${badgeText}</span><span style="color:var(--muted);font-weight:400;font-size:12px">${gapText}</span></div>`;
        }
      }

      // Percentile grid
      const keyPcts = [
        { label: 'p50', val: p50 },
        { label: 'p90', val: h[5]?.[1] || 0 },
        { label: 'p99', val: p99 },
        { label: 'p99.9', val: p999 },
      ];
      const prevH = prevPoint?.histogram || [];
      const prevPcts = [prevH[3]?.[1], prevH[5]?.[1], prevH[7]?.[1], prevH[9]?.[1]];
      const pctItems = keyPcts.map((pct, i) => {
        let dStr = '';
        if (prevPcts[i] && prevPcts[i] > 0) {
          const d = ((pct.val - prevPcts[i]) / prevPcts[i]) * 100;
          if (Math.abs(d) > 1) {
            const sign = d > 0 ? '+' : '';
            const dCls = d > 0 ? 'cpop-delta-sig-down' : 'cpop-delta-sig-up';
            dStr = `<div class="cpop-perf-d ${dCls}">${sign}${d.toFixed(0)}%</div>`;
          }
        }
        return `<div class="cpop-perf-item"><div class="cpop-perf-name">${pct.label}</div><div class="cpop-perf-val">${formatUs(pct.val)}</div>${dStr}</div>`;
      });

      const platLabel = PLATFORM_LABELS[document.getElementById('platformSelect').value] || '';
      popup.innerHTML = `<div class="cpop" style="position:relative">
        <button class="cpop-close" onclick="hideCommitPopup()">✕</button>
        <div class="cpop-header">
          <a class="cpop-hash" href="https://github.com/${repo}/commit/${hash}" target="_blank">${shortHash}</a>
          <span class="cpop-date">${point.date}</span>
        </div>
        <div class="cpop-title">${point.pr_title || shortHash}</div>
        <div class="cpop-links">
          ${point.pr ? `<a href="https://github.com/${repo}/pull/${point.pr}" target="_blank">🔗 PR #${point.pr}</a>` : ''}
          <a href="https://github.com/${repo}/commit/${hash}" target="_blank">📄 Commit</a>
        </div>
        <hr class="cpop-sep">
        <div class="cpop-rps">${formatUs(p99)} <span class="cpop-rps-unit">p99 latency</span></div>
        <div class="cpop-cv">@ ${(point.target_rps/1e6).toFixed(2)}M rps (70% load)</div>
        ${deltaHtml}
        <hr class="cpop-sep">
        <div class="cpop-perf"><div class="cpop-perf-label">Percentiles</div><div class="cpop-perf-grid" style="grid-template-columns:1fr 1fr 1fr 1fr">${pctItems.join('')}</div></div>
        <div class="cpop-footer"><span>Esc to dismiss</span><span>${platLabel}</span></div>
      </div>`;

      popup.style.display = 'block';
      const rect = popup.getBoundingClientRect();
      let left = evt.clientX + 12, top = evt.clientY - 20;
      if (left + rect.width > window.innerWidth - 16) left = evt.clientX - rect.width - 12;
      if (top + rect.height > window.innerHeight - 16) top = window.innerHeight - rect.height - 16;
      if (top < 8) top = 8;
      popup.style.left = left + 'px'; popup.style.top = top + 'px';
    }

    // Click vs drag detection
    let mouseDownPos = null;
    document.addEventListener('mousedown', e => { mouseDownPos = { x: e.clientX, y: e.clientY }; });

    document.addEventListener('keydown', e => { if (e.key === 'Escape') hideCommitPopup(); });
    document.addEventListener('mousedown', e => {
      const popup = document.getElementById('commitPopup');
      if (popup.style.display === 'block' && !popup.contains(e.target)) hideCommitPopup();
    });

    // Store points for popup access
    let currentPoints = null, currentWorkload = null;

    init();
  </script>
  <div id="commitPopup"></div>
</body>
</html>
